# 앱 CI(경로별): app/ 이나 앱이 읽는 공유 파일이 바뀐 PR·main 푸시에서만. 비밀값 없음(fake 모드 테스트).
# 서버 CI 는 server.yml. Android 빌드는 여기서 하지 않는다(긴 시간·서명 — 리드 맥·build-*.sh 에서).
name: app
on:
  pull_request:
    paths:
      - 'app/**'
      - 'docs/team/copy.ko.json' # 앱 사본과 같은지(copySync)
      - 'supabase/migrations/**' # 계약 테스트가 서버 화이트리스트·허용값을 읽는다(eventsContract·pushPlatform)
      - 'scripts/sync-copy.sh'
      - 'design-system/**' # 토큰·브랜드 자산 동기 테스트
      - 'docs/team/legal/publish-drafts/**' # termsAgreement 가 게시본 '버전 N'을 읽는다(PR #53 리뷰 M1)
      - '.github/workflows/app.yml'
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'docs/team/copy.ko.json'
      - 'supabase/migrations/**'
      - 'scripts/sync-copy.sh'
      - 'design-system/**'
      - 'docs/team/legal/publish-drafts/**'
      - '.github/workflows/app.yml'

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 재발 방지(11-20, #133 사고: PR 이 main 의 파일을 지운 채 병합됨). 막지 않고 지운 파일 목록만 경고·요약으로 보인다.
  # 한계: 이 워크플로의 paths 필터 안 파일이 바뀐 PR 에서만 돈다(문서만 지운 PR 은 server.yml·이 잡 모두 안 돈다).
  deleted-files:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # base 와 head 의 갈림점을 찾는다
      - name: main 에서 지운 파일(경고만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deleted="$(git diff --name-only --diff-filter=D "$BASE_SHA...$HEAD_SHA")"
          count=$(printf '%s' "$deleted" | grep -c . || true)
          {
            echo "### main 에서 지운 파일: ${count}개"
            if [ "$count" -gt 0 ]; then
              echo 'PR 범위가 맞는지 확인하세요(의도한 삭제면 PR 본문에 이유를 적는다).'
              echo '```'
              printf '%s\n' "$deleted" | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            echo "::warning title=main 파일 삭제 ${count}개::$(printf '%s' "$deleted" | head -20 | tr '\n' ' ')"
            printf '%s\n' "$deleted"
          fi

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      # 액션은 커밋 SHA 로 고정(태그 이동 방지). 주석은 그 SHA 의 태그
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.11.0' # package.json engines 최솟값
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: 설치(잠금 파일 그대로)
        run: npm ci --no-audit --no-fund
      - name: 문구 사본 = 원본
        working-directory: .
        run: bash scripts/sync-copy.sh --check
      - name: 오픈소스 목록(JS) 최신
        run: node scripts/ossLicenses.js --check
      - name: 타입
        run: npx tsc --noEmit
      - name: 린트(오류 0, 경고 기준선은 layerBaseline 테스트가 지킨다)
        run: npm run lint
      - name: 테스트
        run: npx jest --testPathIgnorePatterns __integration__ --maxWorkers=2 --ci
