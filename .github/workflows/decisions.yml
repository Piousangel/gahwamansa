# 결정 기록(11-25 대기열 42): 새 결정은 docs/decisions/YYYY-MM-DD-<slug>.md 파일 하나씩. docs/decisions/2026-11-25-decisions-per-file.md
# 이 PR이 더하거나 바꾼 항목의 형식이 틀리면 실패한다(이미 main 에 있는 파일 탓에 다른 PR이 막히지 않게). DECISIONS.md 에 새로 붙여 쓰면 경고만(pr-guard 와 같은 원칙).
name: decisions
on:
  pull_request:
    paths:
      - 'docs/decisions/**'
      - 'DECISIONS.md'
      - 'scripts/decisions-index*'
      - '.github/workflows/decisions.yml'

permissions:
  contents: read

concurrency:
  group: decisions-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # DECISIONS.md 붙여 쓰기 경고에 base 와의 갈림점이 필요
          persist-credentials: false
      - name: 색인 스크립트 자체 시험
        run: bash scripts/decisions-index.test.sh
      - name: 이 PR이 더하거나 바꾼 항목 형식(이름·제목·날짜·관련 PR)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          changed=()
          while IFS= read -r f; do changed+=("$f"); done < <(git diff --name-only --diff-filter=AMR "$BASE_SHA...$HEAD_SHA" -- docs/decisions/)
          if [ "${#changed[@]}" -eq 0 ]; then echo "바뀐 결정 항목 없음"; exit 0; fi
          bash scripts/decisions-index.sh --check "${changed[@]}"
      - name: DECISIONS.md 새 항목(경고만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # 기존 '## ' 제목을 고친 것도 '+## ' 로 세진다 — 경고만이라 그대로 둔다
          added="$(git diff --unified=0 "$BASE_SHA...$HEAD_SHA" -- DECISIONS.md | grep -c '^+## ' || true)"
          if [ "$added" -gt 0 ]; then
            echo "::warning file=DECISIONS.md,title=DECISIONS.md 에 새 결정 ${added}개::DECISIONS.md 는 11-25부터 붙여 쓰지 않습니다. docs/decisions/YYYY-MM-DD-<slug>.md 로 옮겨 주세요(병합 충돌 원인, docs/decisions/README.md)."
            echo "### DECISIONS.md 에 새 '## ' 항목 ${added}개 — docs/decisions/ 로 옮겨 주세요" >> "$GITHUB_STEP_SUMMARY"
          fi
          bash scripts/decisions-index.sh >> "$GITHUB_STEP_SUMMARY" # 이 PR 기준 색인(커밋하지 않는 대신 여기서 본다)
