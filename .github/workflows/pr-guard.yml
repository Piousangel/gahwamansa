# PR 가드(11-20 리드 결정): paths 필터 없이 모든 PR 에서 돈다. #133 사고 때 지워진 것은 문서 16개였다(앱 경로 밖).
# 막지 않는다 — 지운 파일 목록·증거 칸·리뷰 인원을 Step Summary·경고로만 보인다(DECISIONS 11-20 운영 규칙).
name: pr-guard
on:
  pull_request:
    types: [opened, edited, synchronize, reopened] # edited: 본문의 '## 증거' 를 채우면 다시 본다

permissions:
  contents: read

concurrency:
  group: pr-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 재발 방지(11-20, #133 사고: PR 이 main 의 파일을 지운 채 병합됨). 막지 않고 지운 파일 목록만 경고·요약으로 보인다.
  deleted-files:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0 # base 와 head 의 갈림점을 찾는다
          persist-credentials: false # 토큰을 작업 폴더에 남기지 않는다(#180 리뷰 L)
      - name: main 에서 지운 파일(경고만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          deleted="$(git diff --name-only --diff-filter=D "$BASE_SHA...$HEAD_SHA")"
          count=$(printf '%s' "$deleted" | grep -c . || true)
          {
            echo "### main 에서 지운 파일: ${count}개"
            if [ "$count" -gt 0 ]; then
              echo 'PR 범위가 맞는지 확인하세요(의도한 삭제면 PR 본문에 이유를 적는다).'
              echo '```'
              printf '%s\n' "$deleted" | head -200
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$count" -gt 0 ]; then
            # 파일 이름이 '::' 로 시작해 워크플로 명령으로 읽히지 않게(#180 리뷰 L): 경고 문구는 %·줄바꿈을 인코딩, 목록은 stop-commands 안에서 출력
            msg="$(printf '%s' "$deleted" | head -20 | tr '\n' ' ' | sed -e 's/%/%25/g' -e 's/\r/%0D/g' -e 's/::/%3A%3A/g')"
            echo "::warning title=main 파일 삭제 ${count}개::${msg}"
            token="stop-$(date +%s%N)"
            echo "::stop-commands::${token}"
            printf '%s\n' "$deleted"
            echo "::${token}::"
          fi
      # 운영 규칙(11-20, 조사 #169): 코드 PR 본문에는 '## 증거'. 위험 영역(.github/risk-paths.txt)은 '리뷰 2명 필요'. 막지 않는다.
      # 판정은 .github/scripts/pr-evidence.sh, 그 판정의 고정 테스트는 pr-evidence.test.sh(먼저 돈다, #180 리뷰)
      - name: 증거 판정 자체 테스트
        run: bash .github/scripts/pr-evidence.test.sh
      - name: 증거 칸·리뷰 인원(경고만)
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
        run: bash .github/scripts/pr-evidence.sh
