# 서버 CI(경로별): supabase/ 나 서버 운영 스크립트가 바뀐 PR·main 푸시에서만. 원격 DB·비밀값을 쓰지 않는다.
# 로컬 Supabase(도커)에서 마이그레이션 처음부터 재생 + 시드 → pgTAP, Edge Function 공용 로직·운영 스크립트 단위 테스트.
name: server
on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'scripts/photos/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server.yml'
  push:
    branches: [main]
    paths:
      - 'supabase/**'
      - 'scripts/photos/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/server.yml'

permissions:
  contents: read

concurrency:
  group: server-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit:
    name: 함수·운영 스크립트 단위 테스트
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24' # .mts 를 node --test 로 직접 돌린다(타입 제거, 23.6+)
      - name: Edge Function 공용 로직
        run: node --test supabase/functions/_shared/*.test.mts
      - name: 운영 스크립트·콘텐츠 게이트
        run: node --test supabase/ops/*.test.mjs scripts/photos/*.test.mjs

  pgtap:
    name: 마이그레이션 재생 + pgTAP
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.11.0'
          cache: npm
      - name: Supabase CLI(루트 devDependency, 잠금 파일 그대로)
        run: npm ci --no-audit --no-fund
      - name: pgTAP 헛통과 검사(앱 역할로 표를 직접 세는 단언, dev-server-notes §21)
        run: node supabase/ops/test-rls-lint.mjs supabase/tests
      - name: 로컬 스택 시작(필요한 것만)
        run: npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
      - name: 처음부터 재생 + 시드
        run: npx supabase db reset
      - name: pgTAP
        run: npx supabase test db
      - name: 정리
        if: always()
        run: npx supabase stop --no-backup
