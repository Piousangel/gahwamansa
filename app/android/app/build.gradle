apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

// Firebase(US-10 뒤): google-services.json 은 flavor 폴더(app/src/<flavor>/, gitignore)에만 둔다. 하나라도 있으면 플러그인을 적용하고,
// 파일이 없는 flavor 는 processXxxGoogleServices 를 끈다(그 flavor 는 Firebase 없이 빌드 — 앱은 토큰 없음으로 동작, fcmTokenSource).
// 둘 다 없으면 아무것도 하지 않는다(지금 상태). 저장소 루트·app/ 바로 아래 google-services.json 은 쓰지 않는다(flavor 섞임 방지).
def googleServicesFlavors = ["staging", "production"].findAll { file("src/${it}/google-services.json").exists() }
if (googleServicesFlavors) {
    apply plugin: "com.google.gms.google-services"
    if (file("google-services.json").exists()) {
        throw new GradleException("app/android/app/google-services.json 은 쓰지 않아요. app/src/<flavor>/google-services.json 에만 두세요(staging·production 섞임 방지).")
    }
    tasks.configureEach { t ->
        def m = t.name =~ /^process(Staging|Production)(Debug|Release)GoogleServices$/
        if (m.matches() && !(m.group(1).toLowerCase() in googleServicesFlavors)) {
            t.enabled = false
        }
    }
    logger.lifecycle("Firebase: google-services.json 있는 flavor = ${googleServicesFlavors.join(', ')}")
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Folders */
    //   The root of your project, i.e. where "package.json" lives. Default is '../..'
    // root = file("../../")
    //   The folder where the react-native NPM package is. Default is ../../node_modules/react-native
    // reactNativeDir = file("../../node_modules/react-native")
    //   The folder where the react-native Codegen package is. Default is ../../node_modules/@react-native/codegen
    // codegenDir = file("../../node_modules/@react-native/codegen")
    //   The cli.js file which is the React Native CLI entrypoint. Default is ../../node_modules/react-native/cli.js
    // cliFile = file("../../node_modules/react-native/cli.js")

    /* Variants */
    //   The list of variants to that are debuggable. For those we're going to
    //   skip the bundling of the JS bundle and the assets. Default is "debug", "debugOptimized".
    //   If you add flavors like lite, prod, etc. you'll have to list your debuggableVariants.
    // debuggableVariants = ["liteDebug", "liteDebugOptimized", "prodDebug", "prodDebugOptimized"]
    // 환경 flavor(staging/production) 때문에 디버그 변형 이름을 직접 적는다(이 변형은 Metro 에서 JS 를 받음)
    debuggableVariants = ["stagingDebug", "stagingDebugOptimized", "productionDebug", "productionDebugOptimized"]

    /* Bundling */
    //   A list containing the node command and its flags. Default is just 'node'.
    // nodeExecutableAndArgs = ["node"]
    //
    //   The command to run when bundling. By default is 'bundle'
    // bundleCommand = "ram-bundle"
    //
    //   The path to the CLI configuration file. Default is empty.
    // 출시 번들 전용 Metro 설정(개발자 메뉴·config.local 제외, env.generated 없으면 멈춤). 개발 서버는 metro.config.js(재검토 R1)
    bundleConfig = file("../../metro.release.config.js")
    //
    //   The name of the generated asset file containing your JS bundle
    // bundleAssetName = "MyApplication.android.bundle"
    //
    //   The entry file for bundle generation. Default is 'index.android.js' or 'index.js'
    // entryFile = file("../js/MyApplication.android.js")
    //
    //   A list of extra flags to pass to the 'bundle' commands.
    //   See https://github.com/react-native-community/cli/blob/main/docs/commands.md#bundle
    // extraPackagerArgs = []

    /* Hermes Commands */
    //   The hermes compiler command to run. By default it is 'hermesc'
    // hermesCommand = "$rootDir/my-custom-hermesc/bin/hermesc"
    //
    //   The list of flags to pass to the Hermes compiler. By default is "-O", "-output-source-map"
    // hermesFlags = ["-O", "-output-source-map"]

    /* Autolinking */
    autolinkLibrariesWithApp()
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 *
 * For example, to use the international variant, you can use:
 * `def jscFlavor = io.github.react-native-community:jsc-android-intl:2026004.+`
 *
 * The international variant includes ICU i18n library and necessary data
 * allowing to use e.g. `Date.toLocaleString` and `String.localeCompare` that
 * give correct results when using with locales other than en-US. Note that
 * this variant is about 6MiB larger per architecture than default.
 */
def jscFlavor = 'io.github.react-native-community:jsc-android:2026004.+'

/**
 * 환경(flavor)별 공개 설정: app/env/<flavor>.env → BuildConfig·리소스·src/lib/env.generated.ts
 * 설계: docs/plans/09-environments.md(2안, 새 의존성 없음), 사용법: docs/team/RELEASE.md
 * production.env 가 없으면 production.env.example 로 빌드하고 경고한다(-PrequireRealEnv 면 실패).
 */
def appEnvDir = file("../../env")
def generatedEnvTs = file("../../src/lib/env.generated.ts")
def requiredEnvKeys = ["APP_ENV", "API_MODE", "SUPABASE_PROJECT_REF", "SUPABASE_URL", "SUPABASE_PUBLISHABLE_KEY", "KAKAO_NATIVE_APP_KEY", "GOOGLE_WEB_CLIENT_ID"]

def readEnvFile = { File f ->
    def m = [:]
    f.eachLine("UTF-8") { line ->
        def t = line.trim()
        if (!t || t.startsWith("#")) return
        def i = t.indexOf("=")
        if (i <= 0) throw new GradleException("${f}: '키=값' 형식이 아닌 줄: ${t}")
        m[t.substring(0, i).trim()] = t.substring(i + 1).trim()
    }
    return m
}

def loadAppEnv = { String flavor ->
    def f = new File(appEnvDir, "${flavor}.env")
    def placeholder = false
    if (!f.exists()) {
        def example = new File(appEnvDir, "${flavor}.env.example")
        if (project.hasProperty("requireRealEnv") || !example.exists()) {
            throw new GradleException("app/env/${flavor}.env 가 없어요. ${flavor}.env.example 을 복사해 실제 공개 값을 채워 주세요(docs/team/RELEASE.md).")
        }
        f = example
        placeholder = true
    }
    def m = readEnvFile(f)
    requiredEnvKeys.each { k ->
        if (!m[k]) throw new GradleException("${f.name}: ${k} 값이 비어 있어요")
    }
    // 비밀값 차단: 이 파일들은 APK 안에 그대로 들어간다
    m.each { k, v ->
        if (k ==~ /(?i).*(secret|service_role|password).*/ || v.startsWith("sb_secret_")) {
            throw new GradleException("${f.name}: 비밀값으로 보이는 ${k} 가 있어요. env 파일에는 공개 값만 둡니다.")
        }
    }
    if (m.APP_ENV != flavor) throw new GradleException("${f.name}: APP_ENV=${m.APP_ENV} 가 flavor(${flavor})와 달라요")
    if (!(m.API_MODE in ["fake", "real"])) throw new GradleException("${f.name}: API_MODE 는 fake 또는 real")
    // production 은 실제 서버만(fake API·개발 훅이 출시 앱에서 쓰이지 않게, 보안 리뷰 2026-11-18 L2)
    if (flavor == "production" && m.API_MODE != "real") throw new GradleException("${f.name}: production 은 API_MODE=real 만 허용")
    if (!(m.KAKAO_NATIVE_APP_KEY ==~ /[0-9a-f]{32}/)) throw new GradleException("${f.name}: KAKAO_NATIVE_APP_KEY 형식(32자리 16진수)이 아니에요")
    // 값 형식 허용 목록(리뷰 L1): APK 로 나가는 Supabase 키 칸은 publishable 키만(레거시 JWT·service_role 차단), URL 은 ref 와 일치
    if (!(m.SUPABASE_PROJECT_REF ==~ /[a-z0-9-]+/)) throw new GradleException("${f.name}: SUPABASE_PROJECT_REF 형식이 아니에요")
    if (!(m.SUPABASE_PUBLISHABLE_KEY ==~ /sb_publishable_[A-Za-z0-9_-]+/)) {
        throw new GradleException("${f.name}: SUPABASE_PUBLISHABLE_KEY 는 sb_publishable_ 로 시작하는 키만 넣어요(anon·service_role JWT 금지)")
    }
    if (m.SUPABASE_URL != "https://${m.SUPABASE_PROJECT_REF}.supabase.co".toString()) {
        throw new GradleException("${f.name}: SUPABASE_URL 이 https://${m.SUPABASE_PROJECT_REF}.supabase.co 와 달라요")
    }
    m.SOURCE = f.name
    m.PLACEHOLDER = placeholder
    return m
}
def appEnvs = [staging: loadAppEnv("staging"), production: loadAppEnv("production")]

/**
 * 카톡 초대 링크 App Links 도메인(APP_LINK_HOST, 선택). 스파이크: docs/team/spikes/2026-11-17-install-referrer-applinks.md
 * - 원본: app/env/<flavor>.env 한 곳. staging 은 별도 서브도메인(같은 도메인을 두 패키지가 검증하면 선택 창)
 * - production 에 테스트 도메인(.test·.invalid·example.*·localhost 등)이면 빌드 실패
 * - 로컬 확인용 -PappLinkHostDebug=<도메인>: debug 빌드 타입에만 적용(release·출시 빌드에는 절대 안 들어감)
 */
def HOST_RE = /[a-z0-9]([a-z0-9-]*[a-z0-9])?(\.[a-z0-9]([a-z0-9-]*[a-z0-9])?)+/
def TEST_HOST_RE = /(?i)(.*\.)?(example\.(com|net|org)|localhost|.*\.(test|invalid|example|localhost|local))/
def checkLinkHost = { String where, String h ->
    if (h && !(h ==~ HOST_RE)) throw new GradleException("${where}: APP_LINK_HOST 는 소문자 도메인만(스킴·경로 없이): ${h}")
    return h ?: ""
}
appEnvs.each { name, e -> e.APP_LINK_HOST = checkLinkHost("${name}.env", (e.APP_LINK_HOST ?: "").toString().trim()) }
if (appEnvs.production.APP_LINK_HOST ==~ TEST_HOST_RE && !appEnvs.production.PLACEHOLDER) {
    throw new GradleException("production.env: APP_LINK_HOST 에 테스트 도메인(${appEnvs.production.APP_LINK_HOST})은 쓸 수 없어요")
}
if (appEnvs.staging.APP_LINK_HOST && appEnvs.staging.APP_LINK_HOST == appEnvs.production.APP_LINK_HOST) {
    throw new GradleException("APP_LINK_HOST 가 staging 과 production 에서 같아요. staging 은 별도 서브도메인을 써 주세요")
}
def appLinkHostDebug = checkLinkHost("-PappLinkHostDebug", (project.findProperty("appLinkHostDebug") ?: "").toString().trim())
if (appLinkHostDebug) {
    logger.warn("경고: -PappLinkHostDebug=${appLinkHostDebug} → debug 빌드에만 App Links host 를 덮어씁니다(release 는 env 파일 값)")
}
def appLinkPlaceholders = { String h -> [appLinkHost: h ?: "applinks.invalid", appLinksEnabled: h ? "true" : "false"] }

/**
 * 앱 정보 값(AU-07, 선택·공개 값): 이용약관·방침 URL, 문의 메일, 사업자 정보. 원본 app/env/<flavor>.env, 앱은 src/lib/appInfo.ts.
 * - 형식이 틀리면 빌드 실패(https URL만, 메일, 사업자등록번호 000-00-00000, 글자는 80자 안·따옴표/꺾쇠/줄바꿈 없음)
 * - 빠지면 화면에서 그 행이 값 없는 행(개발·staging '[설정 필요]')으로 보이고 빌드 경고. production release 는 실패(G-INT "값이 빈 앱 정보 행 0")
 *   — 확인용 빌드만 -PallowMissingAppInfo
 */
def APP_INFO_RULES = [
    TERMS_URL: /https:\/\/[a-z0-9.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?/,
    PRIVACY_URL: /https:\/\/[a-z0-9.-]+\.[a-z]{2,}(\/[^\s"'<>]*)?/,
    CONTACT_EMAIL: /[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}/,
    BIZ_NAME: /[^\n"<>]{1,80}/,
    BIZ_CEO: /[^\n"<>]{1,80}/,
    BIZ_REG_NO: /\d{3}-\d{2}-\d{5}/,
    BIZ_ADDRESS: /[^\n"<>]{1,80}/,
]
appEnvs.each { name, e ->
    APP_INFO_RULES.each { k, re ->
        def v = (e[k] ?: "").toString().trim()
        if (v && !(v ==~ re)) throw new GradleException("${name}.env: ${k} 형식이 아니에요: ${v}")
        e[k] = v
    }
}
def missingAppInfo = { Map e -> APP_INFO_RULES.keySet().findAll { !e[it] } }
// 리뷰 M2: 같은 카카오 키면 두 앱이 같은 kakao{키}://oauth 를 받아 한 폰에 같이 설치 시 웹 로그인 복귀가 엉킨다
if (appEnvs.staging.KAKAO_NATIVE_APP_KEY == appEnvs.production.KAKAO_NATIVE_APP_KEY) {
    logger.warn("경고: staging·production 카카오 네이티브 키가 같아요. 두 앱을 한 폰에 같이 설치하면 카카오 웹 로그인 복귀가 엉킬 수 있어요. staging 키 발급·등록은 docs/team/RELEASE.md '외부 콘솔 등록'.")
}

/**
 * 버전 규칙(docs/team/RELEASE.md):
 * - versionName = app/package.json 의 version(한 곳에서만 바꾼다)
 * - versionCode = git 커밋 수(git rev-list --count HEAD). 출시는 main 에서만 빌드하므로 계속 커진다.
 *   -PversionCode=<숫자> 로 덮을 수 있다(git 이 없는 곳, 핫픽스 재빌드 등). git 을 못 읽으면 빌드 실패(조용히 1 이 되지 않게)
 * - 이전 출시 번호보다 큰지는 scripts/build-production.sh 가 app/android/release-versions.txt 로 확인한다
 */
def appVersionName = new groovy.json.JsonSlurper().parse(file("../../package.json")).version
def gitOutput = { List<String> cmd ->
    try {
        def p = cmd.execute(null, rootDir)
        def out = p.text.trim()
        return p.waitFor() == 0 ? out : ""
    } catch (Exception ignored) {
        return ""
    }
}
def appVersionCode
if (project.hasProperty("versionCode")) {
    appVersionCode = project.property("versionCode").toString().toInteger()
} else {
    def count = gitOutput(["git", "rev-list", "--count", "HEAD"])
    if (!(count ==~ /\d+/)) {
        throw new GradleException("versionCode 를 git 커밋 수로 정하지 못했어요(git 없음·저장소 아님). -PversionCode=<숫자> 를 주세요.")
    }
    appVersionCode = count.toInteger()
}
def appGitSha = gitOutput(["git", "rev-parse", "--short", "HEAD"])

// 번들 직전에 flavor 에 맞는 TS 설정을 쓴다(공개 값만). 파일은 gitignore
// release 번들 검사: Hermes 바이트코드도 ASCII 문자열은 그대로 담긴다. 표식이 있으면 실패한다.
//  - 모든 release: config.local 테스트 계정(devTestChild)·테스트 도메인 이메일(@*.test, @example.*)·config.local 의 문자열 값
//  - production: 개발자 메뉴 구현·세션 보관·테스트 가족 표식
def RELEASE_EMAIL_ALLOW = ["name@example.com"] // 이메일 입력 칸 예시 문구(copy login.email_placeholder)
def verifyReleaseBundle = { Task t, String flavor ->
    def bundles = t.outputs.files.asFileTree.matching { include "**/*.bundle" }.files
    if (bundles.isEmpty()) throw new GradleException("${t.name}: 검사할 번들을 찾지 못했어요")
    def markers = ["devTestChild"]
    if (flavor == "production") markers += ["bumojasik-dev-menu-impl", "dev_menu_session_", "createTestFamily"]
    bundles.each { File b ->
        def text = new String(b.bytes, "ISO-8859-1")
        def hit = markers.findAll { text.contains(it) }
        def emails = (text =~ /[A-Za-z0-9._%+-]+@(?:[A-Za-z0-9-]+\.)*(?:example\.(?:test|com|org)|[A-Za-z0-9-]+\.test)/).collect { it instanceof List ? it[0] : it }.unique().findAll { !(it in RELEASE_EMAIL_ALLOW) }
        def localFile = file("../../src/lib/config.local.ts")
        def localValues = localFile.exists() ? (localFile.text =~ /['"]([^'"]{6,})['"]/).collect { it[1] }.findAll { !(it in ["fake", "real"]) } : []
        hit += localValues.findAll { text.contains(it) }.collect { "config.local 값(${it.length()}자)" }
        if (hit || emails) {
            throw new GradleException("${b.name}(${flavor} release)에 개발 전용 코드·계정 표식이 있어요: ${hit + emails.collect { it.replaceAll(/^[^@]+/, '***') }}")
        }
    }
    logger.lifecycle("release 번들 검사 통과(${flavor}): 개발 전용 표식 없음")
}

// BUILD_TYPE: Metro 가 release 번들에서 config.local·개발자 메뉴를 빼는 근거(metroDevMenu.js). 이 파일 하나만 믿는다
def writeEnvTs = { Map e, String versionName, int versionCode, String linkHost, boolean release ->
    def values = [
        APP_ENV: e.APP_ENV,
        API_MODE: e.API_MODE,
        SUPABASE_PROJECT_REF: e.SUPABASE_PROJECT_REF,
        SUPABASE_URL: e.SUPABASE_URL,
        SUPABASE_KEY: e.SUPABASE_PUBLISHABLE_KEY,
        KAKAO_NATIVE_APP_KEY: e.KAKAO_NATIVE_APP_KEY,
        GOOGLE_WEB_CLIENT_ID: e.GOOGLE_WEB_CLIENT_ID,
        APP_LINK_HOST: linkHost,
        VERSION_NAME: versionName,
        VERSION_CODE: versionCode,
        GIT_SHA: appGitSha,
        BUILD_TYPE: release ? "release" : "debug",
    ] + APP_INFO_RULES.keySet().collectEntries { [(it): e[it] ?: ""] }
    def body = groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson(values))
    generatedEnvTs.setText("// 자동 생성(Gradle, app/env/${e.SOURCE}). 직접 고치지 않는다. gitignore.\n" +
            "export default ${body};\n", "UTF-8")
}

/**
 * release 서명: 업로드 키 경로·비밀번호는 저장소 밖에서만 읽는다.
 * 1) 사용자 맥의 ~/.gradle/gradle.properties  2) 같은 이름의 환경변수
 * 없으면 debug 키로 서명하고 경고한다(-PrequireReleaseSigning 이면 실패).
 */
def signingValue = { String name -> (project.findProperty(name) ?: System.getenv(name))?.toString() }
def uploadStoreFile = signingValue("BUMOJASIK_UPLOAD_STORE_FILE")
def uploadStorePassword = signingValue("BUMOJASIK_UPLOAD_STORE_PASSWORD")
def uploadKeyAlias = signingValue("BUMOJASIK_UPLOAD_KEY_ALIAS")
def uploadKeyPassword = signingValue("BUMOJASIK_UPLOAD_KEY_PASSWORD")
def hasReleaseSigning = uploadStoreFile && uploadStorePassword && uploadKeyAlias && uploadKeyPassword &&
        file(uploadStoreFile).exists()
if (!hasReleaseSigning) {
    def why = uploadStoreFile && !file(uploadStoreFile).exists() ? "키스토어 파일이 없어요(${uploadStoreFile})" : "BUMOJASIK_UPLOAD_* 4개 값이 없어요"
    if (project.hasProperty("requireReleaseSigning")) {
        throw new GradleException("release 서명 설정이 필요해요: ${why}. docs/team/RELEASE.md '서명' 참고")
    }
    logger.warn("경고: release 서명 설정 없음(${why}) → release 빌드를 debug 키로 서명합니다. Play 업로드·카카오/구글 release 지문과 맞지 않아요.")
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.bumojasik.app"
    defaultConfig {
        applicationId "com.bumojasik.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
    }
    buildFeatures {
        buildConfig true
    }

    // 환경 분리(09): 두 앱이 한 폰에 같이 설치된다. staging 은 Play 에 올리지 않는다(adb·App Distribution)
    flavorDimensions "env"
    productFlavors {
        staging {
            dimension "env"
            applicationIdSuffix ".staging"
            versionNameSuffix "-staging"
        }
        production {
            dimension "env"
        }
    }
    productFlavors.configureEach { flavor ->
        def e = appEnvs[flavor.name]
        // 카카오 웹 로그인 복귀 scheme(kakao{네이티브 앱 키}). 키 원본은 app/env/<flavor>.env 한 곳
        flavor.resValue "string", "kakao_scheme", "kakao" + e.KAKAO_NATIVE_APP_KEY
        // APK 에서 어떤 환경인지 확인용(aapt2 dump resources 로 보임). 공개 값만
        flavor.resValue "string", "app_env", e.APP_ENV
        flavor.resValue "string", "supabase_url", e.SUPABASE_URL
        flavor.buildConfigField "String", "APP_ENV", "\"${e.APP_ENV}\""
        flavor.buildConfigField "String", "SUPABASE_URL", "\"${e.SUPABASE_URL}\""
        flavor.buildConfigField "String", "SUPABASE_PROJECT_REF", "\"${e.SUPABASE_PROJECT_REF}\""
        flavor.buildConfigField "boolean", "ENV_PLACEHOLDER", "${e.PLACEHOLDER}"
        // 카톡 초대 링크 App Links(https://<host>/c#123456). 값의 원본은 app/env/<flavor>.env 의 APP_LINK_HOST 한 곳.
        // 비어 있으면(도메인 미정) activity-alias enabled=false. 로컬 확인용 덮어쓰기는 debug 빌드 타입에만(아래 buildTypes.debug)
        flavor.manifestPlaceholders += appLinkPlaceholders(e.APP_LINK_HOST)
    }
    sourceSets {
        // 스테이징 런처·스플래시(배지 T)는 브랜드 원본 폴더를 직접 연결(복사본을 두지 않음). 앱 이름은 src/staging/res
        staging {
            res.srcDirs += ["../../../design-system/assets/brand/android/staging/res"]
        }
    }

    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        if (hasReleaseSigning) {
            release {
                storeFile file(uploadStoreFile)
                storePassword uploadStorePassword
                keyAlias uploadKeyAlias
                keyPassword uploadKeyPassword
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            // 로컬 확인용 App Links host 덮어쓰기(debug 만, 빌드 타입 값이 flavor 값보다 우선)
            if (appLinkHostDebug) {
                manifestPlaceholders += appLinkPlaceholders(appLinkHostDebug)
            }
        }
        release {
            // 업로드 키(사용자 맥에만). 설정이 없으면 위 경고와 함께 debug 키
            signingConfig hasReleaseSigning ? signingConfigs.release : signingConfigs.debug
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }
}

// env.generated.ts 규칙(리뷰 M1: 마지막 release 값이 남아 Metro 가 엉뚱한 서버로 붙지 않게):
// - 디버그 변형: preBuild 때 자기 flavor 값으로 쓴다(Metro 가 이 파일을 읽음). Metro 는 마지막으로 빌드한 디버그 flavor 값을 준다
// - release 변형: JS 번들 작업 바로 직전에 쓰고, 번들이 끝나면(실패해도) 지운다 → 그 뒤 Metro 는 기본값(로컬+fake)
//   (한 번에 두 flavor 를 빌드해도 각자 자기 값으로 번들된다)
def cleanGeneratedAppEnv = tasks.register("cleanGeneratedAppEnv") {
    description = "release 번들 뒤 src/lib/env.generated.ts 를 지운다(Metro 가 release 값을 물려받지 않게)"
    outputs.upToDateWhen { false }
    doLast { generatedEnvTs.delete() }
}
android.applicationVariants.configureEach { variant ->
    def e = appEnvs[variant.flavorName]
    def vName = variant.versionName
    def vCode = variant.versionCode
    def isRelease = !variant.buildType.debuggable
    // 매니페스트와 같은 host 를 JS 에도(리뷰 M3: allowedHost 강제). debug 덮어쓰기는 debug 변형에만
    def linkHost = isRelease ? e.APP_LINK_HOST : (appLinkHostDebug ?: e.APP_LINK_HOST)
    def checkPlaceholder = {
        if (e.PLACEHOLDER) {
            // 리뷰 L2: 예시 값으로 출시 빌드가 조용히 성공하지 않게. 로컬 확인용은 -PallowPlaceholderEnv
            if (isRelease && !project.hasProperty("allowPlaceholderEnv")) {
                throw new GradleException("app/env/${variant.flavorName}.env 가 없어 ${variant.name} 을 만들 수 없어요(예시 값 금지). 확인용이면 -PallowPlaceholderEnv")
            }
            logger.warn("경고: app/env/${variant.flavorName}.env 가 없어 ${e.SOURCE}(예시 값)로 빌드합니다. 이 앱은 서버에 붙지 못해요.")
        }
    }
    // AU-07: 빠진 앱 정보 값은 경고, production release 는 실패(G-INT)
    def checkAppInfo = {
        def missing = missingAppInfo(e)
        if (!missing) return
        // 리뷰 L4: 출시 경로(build-production.sh 가 늘 주는 -PrequireRealEnv)에서는 -PallowMissingAppInfo 를 무시한다
        def allowMissing = project.hasProperty("allowMissingAppInfo") && !project.hasProperty("requireRealEnv")
        if (variant.flavorName == "production" && isRelease && !e.PLACEHOLDER && !allowMissing) {
            throw new GradleException("production.env: 앱 정보 값이 없어요(설정 화면에서 값 없는 행): ${missing.join(', ')}. G-INT 전 필수(US-03·US-04). 확인용 빌드만 -PallowMissingAppInfo(출시 경로 -PrequireRealEnv 에서는 무시)")
        }
        logger.warn("경고: ${e.SOURCE} 에 앱 정보 값이 없어 설정 화면에서 '[설정 필요]'로 보이는 행: ${missing.join(', ')} (AU-07, G-INT 전 필수)")
    }
    def generate = {
        checkPlaceholder()
        checkAppInfo()
        // 2026-11-19 E2E 에서 발견: assembleStagingDebug 그래프에도 preProductionDebugBuild 가 끼어(라이브러리 debug 의존) 나중에 도는 쪽이
        // env.generated.ts 를 production 값으로 덮어써 Metro(디버그) 앱이 production 처럼 동작했다(개발자 메뉴 막힘).
        // 요청한 작업 이름에 변형 이름이 있으면(예: assembleStagingDebug) 그 변형만 쓴다. 이름이 없으면(assembleDebug 등) 예전처럼
        def requested = gradle.startParameter.taskNames.join(" ").toLowerCase()
        def named = ["stagingdebug", "stagingrelease", "productiondebug", "productionrelease"].any { requested.contains(it) }
        // 리뷰 M-R1: 디버그 변형만 건너뛴다 — release 번들은 언제나 자기 값을 쓴다(혼합 호출에서도 번들 직전 generate)
        if (!isRelease && named && !requested.contains(variant.name.toLowerCase())) {
            return
        }
        writeEnvTs(e, vName, vCode, linkHost, isRelease)
    }
    // preBuild: 디버그는 생성 파일을 쓰고, release 는 예시 값·앱 정보 검사만(네이티브 컴파일 전에 일찍 실패)
    variant.preBuildProvider.configure { doFirst { isRelease ? { checkPlaceholder(); checkAppInfo() }() : generate() } }
    def bundleTask = "createBundle${variant.name.capitalize()}JsAndAssets"
    tasks.matching { it.name == bundleTask }.configureEach { t ->
        // env 값·버전이 바뀌면 번들을 다시 만든다(생성 파일 내용은 doFirst 전에 검사되므로 따로 입력으로 둔다)
        t.inputs.property("appEnv", e.collectEntries { k, v -> [(k): v.toString()] })
        t.inputs.property("appVersion", "${vName}/${vCode}/${appGitSha}")
        t.inputs.property("appLinkHost", linkHost)
        t.doFirst { generate() }
        if (isRelease) {
            t.finalizedBy(cleanGeneratedAppEnv)
            // 산출물 검사(보안 리뷰 2026-11-18 M1②): 실제로 APK 에 들어갈 번들에 개발 전용 코드·테스트 계정이 있으면 빌드 실패
            t.doLast { verifyReleaseBundle(t, variant.flavorName) }
        }
    }
}

dependencies {
    // 시스템 스플래시(Android 12+ SplashScreen API, 24~30 은 같은 모습 compat). 정확한 버전 고정(1.2.0, 2025-11 배포)
    implementation("androidx.core:core-splashscreen:1.2.0")
    // Google Play Install Referrer(공식 클라이언트, 정확한 버전 고정). 첫 실행 1회만 읽는다 — InstallReferrerModule
    // https://developer.android.com/google/play/installreferrer/library
    implementation("com.android.installreferrer:installreferrer:2.2")
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}

/**
 * 오픈소스 라이선스 목록(AU-06): Android 네이티브(Maven) 의존성 → src/oss/android.generated.json. JS 목록은 scripts/ossLicenses.js.
 * - 근원: productionReleaseRuntimeClasspath 의 외부 모듈(프로젝트 모듈 = react-native-* 는 JS 목록에 있음) + 각 POM 의 <licenses>
 *   (POM 에 없으면 부모 POM 을 3단계까지 따라간다). 새 의존성·플러그인 없음.
 * - 다시 만들기: cd app && npm run oss:android
 * - production release 빌드는 두 목록이 최신인지 검사한다(verifyOssLicenses, 낡으면 실패 — 의존성 바꾼 뒤 npm run oss). POM 조회 실패는 따로 알림
 */
def ossAndroidOut = file("../../src/oss/android.generated.json")
// POM 을 못 받은 모듈(네트워크·저장소 문제)은 fails 에 모은다 — "목록이 낡았어요"와 다른 실패로 알리기 위해(리뷰 O1)
def ossPomLicenses
ossPomLicenses = { String group, String module, String version, int depth, List fails ->
    def id = org.gradle.internal.component.external.model.DefaultModuleComponentIdentifier.newId(
        org.gradle.api.internal.artifacts.DefaultModuleIdentifier.newId(group, module), version)
    def res = project.dependencies.createArtifactResolutionQuery()
        .forComponents([id])
        .withArtifacts(org.gradle.maven.MavenModule, org.gradle.maven.MavenPomArtifact)
        .execute()
    for (c in res.resolvedComponents) {
        for (a in c.getArtifacts(org.gradle.maven.MavenPomArtifact)) {
            if (!(a instanceof org.gradle.api.artifacts.result.ResolvedArtifactResult)) continue
            def pom = new groovy.xml.XmlSlurper(false, false).parse(a.file)
            def lic = pom.licenses.license.collect { [name: it.name.text().trim(), url: it.url.text().trim()] }.findAll { it.name || it.url }
            if (lic || depth >= 3 || !pom.parent.artifactId.text()) return lic
            return ossPomLicenses(pom.parent.groupId.text().trim(), pom.parent.artifactId.text().trim(), pom.parent.version.text().trim(), depth + 1, fails)
        }
    }
    fails << "${group}:${module}:${version}".toString()
    return []
}
def ossAndroidJson = {
    def conf = configurations.getByName("productionReleaseRuntimeClasspath")
    def ids = conf.incoming.resolutionResult.allComponents
        .collect { it.id }
        .findAll { it instanceof org.gradle.api.artifacts.component.ModuleComponentIdentifier }
        .collect { [group: it.group, module: it.module, version: it.version] }
        .unique()
        .sort { a, b -> "${a.group}:${a.module}".toString() <=> "${b.group}:${b.module}".toString() ?: a.version <=> b.version }
    def fails = []
    def rows = ids.collect { m ->
        [name: "${m.group}:${m.module}".toString(), version: m.version, licenses: ossPomLicenses(m.group, m.module, m.version, 0, fails)]
    }
    if (fails) {
        throw new GradleException("오픈소스 라이선스(Android): POM 조회 실패(네트워크·저장소 문제로 보임, 목록이 낡은 것과 다름) ${fails.size()}개: ${fails.take(5).join(', ')}. 연결을 확인하고 다시 실행해 주세요.")
    }
    return groovy.json.JsonOutput.prettyPrint(groovy.json.JsonOutput.toJson([packages: rows])) + "\n"
}
def ossDiff = { String cur, String next ->
    def names = { String t -> t ? (t =~ /"name": "([^"]+)",\s*"version": "([^"]+)"/).collect { "${it[1]}@${it[2]}".toString() } as Set : [] as Set }
    def a = names(cur)
    def b = names(next)
    return ((b - a).collect { "+${it}" } + (a - b).collect { "-${it}" }).take(5).join(', ')
}
tasks.register("generateOssAndroid") {
    group = "oss"
    description = "Android 네이티브 의존성 라이선스 목록을 src/oss/android.generated.json 으로(AU-06)"
    notCompatibleWithConfigurationCache("의존성 해석·POM 읽기")
    doLast {
        ossAndroidOut.setText(ossAndroidJson(), "UTF-8")
        logger.lifecycle("오픈소스 라이선스 목록(Android) → ${ossAndroidOut}")
    }
}
tasks.register("verifyOssLicenses") {
    group = "oss"
    description = "production release 빌드 전: JS·Android 라이선스 목록이 최신인지(AU-06)"
    notCompatibleWithConfigurationCache("의존성 해석·node 실행")
    doLast {
        def next = ossAndroidJson()
        def cur = ossAndroidOut.exists() ? ossAndroidOut.getText("UTF-8") : ""
        if (cur != next) {
            throw new GradleException("오픈소스 라이선스 목록(Android)이 낡았어요(${ossDiff(cur, next) ?: '내용 차이'}). app 에서 npm run oss 로 다시 만들어 커밋해 주세요.")
        }
        def proc = ["node", file("../../scripts/ossLicenses.js").absolutePath, "--check"].execute(null, file("../.."))
        proc.waitForProcessOutput(System.out, System.err)
        if (proc.exitValue() != 0) throw new GradleException("오픈소스 라이선스 목록(JS)이 낡았어요. app 에서 npm run oss 로 다시 만들어 커밋해 주세요.")
    }
}
// 리뷰 O1: 검사는 production release(출시 산출물)에서만 — staging release·디버그는 네트워크·node 상태와 무관하게 빌드
android.applicationVariants.configureEach { variant ->
    if (!variant.buildType.debuggable && variant.flavorName == "production") {
        variant.preBuildProvider.configure { dependsOn("verifyOssLicenses") }
    }
}
