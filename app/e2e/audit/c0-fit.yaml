# C0 자녀 로그인 첫 화면 실측(PR #16, S25 카카오 버튼 잘림). 카카오·구글 버튼이 온전히 보이는지 캡처로 본다.
# 실행 예: ANDROID_SERIAL=emulator-5556 AVD=gahwa_small METRO_PORT=8091 DP_SIZE=411x891 app/e2e/run.sh audit/c0-fit.yaml
# 주의: 다른 레인이 8081 을 쓰는 중이면 앱 데이터를 지운 뒤 debug_http_host 를 10.0.2.2:<METRO_PORT> 로 적어 두고 실행(p1-fit.yaml 머리 주석). 그래서 clearState 를 쓰지 않는다.
appId: com.bumojasik.app.staging
name: C0 실측
tags:
  - audit
---
- launchApp
- runFlow:
    file: ../common/dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: '이 휴대폰은 누구 거예요\?'
    timeout: 60000
- tapOn: '자녀 휴대폰이에요.*'
- extendedWaitUntil:
    visible: '.*Google.*'
    timeout: 10000
- waitForAnimationToEnd
- takeScreenshot: c0-fit
- assertVisible: '.*카카오.*'
- assertVisible: '.*Google.*'
# 출구(P-13, 전문가 리뷰 r2 H): 제목 바로 아래 한 줄 — 스크롤 없이 첫 화면에서 보여야 한다(모든 배율)
# 첫 화면 끝 걸침(R-15, #163 리뷰)은 좌표로만 볼 수 있어 audit/c0-fold.yaml + FOLD_CHECK=body 로 따로 본다(이 흐름은 C0b·C0c 까지 이어져 첫 화면에서 멈추지 않음)
- assertVisible:
    id: 'parent-exit'
- takeScreenshot: c0a-exit
# C0 v4: 로그인 고르기(C0-a) → 이메일(C0-b) → 인증번호(C0-c). 200%에서는 이메일 링크가 본문 끝이라 아래로 스크롤해 찾는다(fake API 기준, P-13 뒤 출구는 제목 아래)
- scrollUntilVisible:
    element: '이메일로 시작하기'
    direction: DOWN
- takeScreenshot: c0a-scrolled
- tapOn: '이메일로 시작하기'
- extendedWaitUntil:
    visible: '이메일로 시작해요'
    timeout: 10000
- takeScreenshot: c0b
- tapOn:
    id: 'email-field'
- inputText: 'kid@example.test'
- takeScreenshot: c0b-keyboard
- hideKeyboard
- tapOn: '인증번호 받기'
- extendedWaitUntil:
    visible: '이메일 주소로' # 자판이 열리면 제목은 접힌다(BackLink 만 남음)
    timeout: 10000
- hideKeyboard
- waitForAnimationToEnd
- takeScreenshot: c0c
