# 공용: (C3 대기 화면에서) 개발자 메뉴로 어르신 전환 → 번호 123456 연결·동의 → 다시 자녀 전환 → C4 앨범(연결됨).
# 한 기기 fake 로 두 기기 연결을 흉내 낸다(같은 fake 상태: 자녀 가족의 번호 123456 을 어르신이 쓰면 childLinked).
appId: com.bumojasik.app.staging
---
- tapOn: '설정'
# 설정 목록이 뜰 때까지(200%에서는 '앱 정보' 가 첫 화면 밖이라 목록 묶음 id 로 기다린다, #272)
- extendedWaitUntil:
    visible:
      id: 'c7-block'
    timeout: 10000
- runFlow:
    file: edge-scroll.yaml
    env:
      TARGET: '앱 정보'
# 개발 경고 알림이 '앱 정보' 행을 덮지 않게(dismiss-logbox.yaml)
- runFlow:
    file: dismiss-logbox.yaml
- tapOn: '앱 정보'
# C7 앱 정보 화면이 뜰 때까지(설정 화면의 '버전 1.0.0' 보조 글을 버전 줄로 잘못 누르지 않게, 2026-11-19 재검증에서 발견)
- extendedWaitUntil:
    visible: 'AI가 만든 것'
    timeout: 10000
- runFlow:
    file: dev-menu.yaml
    env:
      ROLE_LABEL: '어르신으로'
# 어르신: fake 는 번호 화면(P1)부터 시작
- extendedWaitUntil:
    visible: '가족에게 받은.*'
    timeout: 15000
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
# 200%: 키 4~0 줄은 첫 화면 밖(parent-connect.yaml 과 같음)
- runFlow:
    file: edge-scroll.yaml
    env:
      TARGET: '0'
- tapOn: '4'
- tapOn: '5'
- tapOn: '6'
- extendedWaitUntil:
    visible: '이 번호로 연결하기'
    timeout: 10000
- takeScreenshot: ${PREFIX}-p1c-from-child
- tapOn: '이 번호로 연결하기'
- extendedWaitUntil:
    visible: '고른 답을.*나눠요'
    timeout: 10000
# 200%: '좋아요' 는 본문 끝
- runFlow:
    file: edge-scroll.yaml
    env:
      TARGET: '좋아요'
- tapOn: '좋아요'
- extendedWaitUntil:
    visible: '설정'
    timeout: 10000
- tapOn: '설정'
- runFlow:
    file: dev-menu.yaml
    env:
      ROLE_LABEL: '자녀로'
- extendedWaitUntil:
    visible: '응원 보내기'
    timeout: 15000
