# 공용: (C3 대기 화면에서) 개발자 메뉴로 어르신 전환 → 번호 123456 연결·동의 → 다시 자녀 전환 → C4 앨범(연결됨).
# 한 기기 fake 로 두 기기 연결을 흉내 낸다(같은 fake 상태: 자녀 가족의 번호 123456 을 어르신이 쓰면 childLinked).
appId: com.bumojasik.app.staging
---
- tapOn: '설정'
- extendedWaitUntil:
    visible: '앱 정보'
    timeout: 10000
- runFlow:
    file: edge-scroll.yaml
    env:
      TARGET: '앱 정보'
- tapOn: '앱 정보'
- runFlow:
    file: dev-menu.yaml
    env:
      ROLE_LABEL: '어르신으로'
# 어르신: fake 는 번호 화면(P1)부터 시작
- extendedWaitUntil:
    visible: '가족에게 받은.*'
    timeout: 15000
- tapOn: '1'
- tapOn: '2'
- tapOn: '3'
- tapOn: '4'
- tapOn: '5'
- tapOn: '6'
- extendedWaitUntil:
    visible: '이 번호로 연결하기'
    timeout: 10000
- takeScreenshot: ${PREFIX}-p1c-from-child
- tapOn: '이 번호로 연결하기'
- extendedWaitUntil:
    visible: '고른 답을.*나눠요'
    timeout: 10000
- tapOn: '좋아요'
- extendedWaitUntil:
    visible: '설정'
    timeout: 10000
- tapOn: '설정'
- runFlow:
    file: dev-menu.yaml
    env:
      ROLE_LABEL: '자녀로'
- extendedWaitUntil:
    visible: '응원 보내기'
    timeout: 15000
