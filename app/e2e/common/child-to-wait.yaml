# 공용: 새 설치 → 자녀 → C0 카카오(fake 성공) → C1 호칭 '엄마' → C2 번호(123456) → C3 연결 기다리기
appId: com.bumojasik.app.staging
---
- launchApp:
    clearState: true
- runFlow:
    file: dismiss-system-dialogs.yaml
- extendedWaitUntil:
    visible: '이 휴대폰은 누구 거예요\?'
    timeout: 60000
- tapOn: '자녀 휴대폰이에요.*'
- extendedWaitUntil:
    visible: '카카오 로그인'
    timeout: 10000
- takeScreenshot: ${PREFIX}-c0
- tapOn: '카카오 로그인'
- extendedWaitUntil:
    visible: '부모님을 어떻게 부르세요\?'
    timeout: 10000
- tapOn: '엄마'
- takeScreenshot: ${PREFIX}-c1
- tapOn: '번호 만들기'
- extendedWaitUntil:
    visible: '번호가 만들어졌어요'
    timeout: 10000
- takeScreenshot: ${PREFIX}-c2
- tapOn: '연결 기다리기'
- extendedWaitUntil:
    visible:
      id: 'wait-chip'
    timeout: 10000
