# 공용: 새 설치 → 자녀 → C0 카카오(fake 성공) → C1 호칭 '엄마' → 번호 만들기 → C3 연결 기다리는 중(V9: C2 없이 바로)
appId: com.bumojasik.app.staging
---
- launchApp:
    clearState: true
- runFlow:
    file: wait-first-screen.yaml
- tapOn: '자녀 휴대폰이에요.*'
- extendedWaitUntil:
    visible: '카카오 로그인'
    timeout: 10000
- takeScreenshot: ${PREFIX}-c0
- tapOn: '카카오 로그인'
- extendedWaitUntil:
    visible: '부모님을 어떻게 부르세요\?'
    timeout: 10000
- tapOn: '엄마'
- takeScreenshot: ${PREFIX}-c1
- tapOn: '번호 만들기'
- extendedWaitUntil:
    visible:
      id: 'wait-code'
    timeout: 10000
