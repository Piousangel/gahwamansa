# 에뮬레이터 시스템 창 정리(앱 밖). 없으면 아무것도 하지 않는다.
# 시스템 프로세스 창만 닫는다("Process system isn't responding", "System UI isn't responding"). 우리 앱의 ANR 창은 닫지 않고, run.sh 가 logcat 으로 실패 처리한다(리뷰 M1)
# System UI 창: 새로 부팅한 에뮬레이터에서 첫 실행을 막는다(#194 자녀 캡처)
appId: com.bumojasik.app.staging
---
- repeat:
    times: 3
    while:
      visible: ".*Process system.*responding.*"
    commands:
      - tapOn: 'Wait'
- repeat:
    times: 3
    while:
      visible: ".*System UI.*responding.*"
    commands:
      - tapOn: 'Wait'
