# 공용: ${TARGET}(정규식)이 보일 때까지 왼쪽 가장자리(3%, 누를 것이 없는 자리)에서 천천히 끌어 올린다(최대 8번).
# scrollUntilVisible 은 화면 가운데에서 빠르게 스와이프해 그 자리 행을 누른 것으로 잡힐 수 있다(2026-11-18 F6 안정화).
appId: com.bumojasik.app.staging
---
- repeat:
    times: 8
    while:
      notVisible: ${TARGET}
    commands:
      - swipe:
          start: 3%, 75%
          end: 3%, 35%
          duration: 600
- assertVisible: ${TARGET}
