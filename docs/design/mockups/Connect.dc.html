<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>코드 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF7; color: #1B1B18; font-family: 'Noto Sans KR', sans-serif; padding: 56px 24px 28px; display: flex; flex-direction: column; gap: 22px">
  <div style="display: flex; flex-direction: column; gap: 10px">
    <h1 style="margin: 0; font-size: 34px; font-weight: 900; line-height: 1.3">자녀가 보내 준<br>숫자 여섯 개를<br>눌러 주세요</h1>
    <div style="font-size: 20px; color: #55524A; line-height: 1.5">카톡으로 받은 숫자예요</div>
  </div>

  <div style="display: flex; gap: 8px; justify-content: space-between">
    <sc-for list="{{boxes}}" as="b" hint-placeholder-count="6">
      <div style="width: 50px; height: 68px; box-sizing: border-box; border-radius: 14px; background: #FFFFFF; border: 3px solid {{b.border}}; display: flex; align-items: center; justify-content: center; font-size: 36px; font-weight: 900">{{b.ch}}</div>
    </sc-for>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px">
    <sc-for list="{{keys}}" as="k" hint-placeholder-count="12">
      <button onClick="{{k.press}}" style="height: 68px; border-radius: 18px; border: 2px solid #D9D6CC; background: #FFFFFF; color: #1B1B18; font-family: inherit; font-size: {{k.size}}px; font-weight: 700">{{k.label}}</button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Main.dc.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 36px; background: #1F6F5C; color: #FFFFFF; font-size: 26px; font-weight: 900; text-decoration: none; opacity: {{btnOpacity}}">연결하기</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { code: '482' };
  }
  renderVals() {
    const code = this.state.code;
    const boxes = [0, 1, 2, 3, 4, 5].map((i) => ({
      ch: code[i] || '',
      border: i === code.length ? '#1F6F5C' : '#D9D6CC'
    }));
    const digits = ['1', '2', '3', '4', '5', '6', '7', '8', '9'];
    const keys = digits.map((d) => ({
      label: d,
      size: 30,
      press: () => this.setState((s) => (s.code.length < 6 ? { code: s.code + d } : null))
    }));
    keys.push({ label: '전부 지움', size: 18, press: () => this.setState({ code: '' }) });
    keys.push({
      label: '0',
      size: 30,
      press: () => this.setState((s) => (s.code.length < 6 ? { code: s.code + '0' } : null))
    });
    keys.push({ label: '한 칸 지움', size: 18, press: () => this.setState((s) => ({ code: s.code.slice(0, -1) })) });
    return { boxes, keys, btnOpacity: code.length === 6 ? 1 : 0.45 };
  }
}
</script>
</body>
</html>
