<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 0 };
  }
  renderVals() {
    const labels = ['오늘도 잘하셨어요', '사랑해요', '저녁에 전화드릴게요'];
    const cheers = labels.map((label, i) => {
      const on = this.state.picked === i;
      return {
        label,
        bg: on ? '#FFD9C2' : '#FFFFFF',
        color: '#2F2A24',
        border: on ? '#C2410C' : '#8C7A55',
        pick: () => this.setState({ picked: i })
      };
    });
    return { cheers };
  }
}
</script>
