<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>혼합 · 코드 입력</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF1DC; color: #2F2A24; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; padding: 56px 24px 28px; gap: 16px">
  <div style="position: absolute; left: 12px; right: 12px; top: 10px; display: flex; gap: 6px; align-items: center"><span style="font-size: 12px; color: #5C4E33; font-weight: 700">[시안 상태 전환]</span><button onClick="{{goDefault}}" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #8C7A55; background: #FFFFFF; color: #2F2A24; font-family: inherit; font-size: 14px; font-weight: 700">기본</button><button onClick="{{goError}}" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #8C7A55; background: #FFFFFF; color: #2F2A24; font-family: inherit; font-size: 14px; font-weight: 700">오류</button><button onClick="{{goLock}}" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #8C7A55; background: #FFFFFF; color: #2F2A24; font-family: inherit; font-size: 14px; font-weight: 700">잠금</button></div>
  <div style="display: flex; align-items: center; gap: 14px; margin-top: 24px">
    <div style="width: 84px; height: 84px; box-sizing: border-box; flex-shrink: 0; border: 2px dashed #8C7A55; background: #EFE4CC; color: #5C4E33; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 16px; font-weight: 700; line-height: 1.2; ">[해님]<br>기본</div>
    <div style="position: relative; flex-grow: 1; background: #FFFFFF; border-radius: 22px; padding: 14px 16px; font-family: 'Jua', sans-serif; font-size: 24px; line-height: 1.35; box-shadow: 0 2px 0 #E3D3B0">안녕하세요, 저는 해님이에요</div>
  </div>
  <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 32px; font-weight: 400; line-height: 1.3">자녀분께 받은 번호를<br>써 주세요</h1>
  <div style="display: flex; gap: 8px"><div style="flex: 1; height: 68px; border-radius: 16px; box-sizing: border-box; background: {{boxBg}}; border: 3px solid {{boxBorder}}; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 34px">{{d0}}</div><div style="flex: 1; height: 68px; border-radius: 16px; box-sizing: border-box; background: {{boxBg}}; border: 3px solid {{boxBorder}}; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 34px">{{d1}}</div><div style="flex: 1; height: 68px; border-radius: 16px; box-sizing: border-box; background: {{boxBg}}; border: 3px solid {{boxBorder}}; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 34px">{{d2}}</div><div style="flex: 1; height: 68px; border-radius: 16px; box-sizing: border-box; background: {{boxBg}}; border: 3px solid {{boxBorder}}; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 34px">{{d3}}</div><div style="flex: 1; height: 68px; border-radius: 16px; box-sizing: border-box; background: {{boxBg}}; border: 3px solid {{boxBorder}}; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 34px">{{d4}}</div><div style="flex: 1; height: 68px; border-radius: 16px; box-sizing: border-box; background: {{boxBg}}; border: 3px solid {{boxBorder}}; display: flex; align-items: center; justify-content: center; font-family: 'Jua', sans-serif; font-size: 34px">{{d5}}</div></div>
  <div style="font-size: 20px; font-weight: 500; color: #5C4E33; display: {{hintDisplay}}">{{hintText}}</div>

  <div style="display: {{panelDisplay}}; flex-direction: column; gap: 6px; background: {{panelBg}}; border: 3px solid {{panelBorder}}; border-radius: 22px; padding: 14px 16px">
    <div style="display: flex; align-items: center; gap: 10px"><div style="width: 40px; height: 40px; box-sizing: border-box; flex-shrink: 0; border: 2px dashed #8C7A55; background: #EFE4CC; color: #5C4E33; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.2; ">[해님]<br>걱정</div><div style="font-family: 'Jua', sans-serif; font-size: 28px; color: #2F2A24">{{panelTitle}}</div></div>
    <div style="font-size: 20px; font-weight: 500; line-height: 1.4">{{panelBody}}</div>
  </div>

  <div style="flex-grow: 1"></div>

  <div style="display: flex; flex-direction: column; gap: 12px">
    <button onClick="{{mainAction}}" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 36px; border: none; background: {{btnBg}}; color: {{btnColor}}; font-family: 'Jua', sans-serif; font-size: 32px; box-shadow: 0 4px 0 {{btnShadow}}">{{btnLabel}}</button>
    <button style="display: {{subDisplay}}; align-items: center; justify-content: center; height: 64px; border-radius: 32px; background: transparent; border: 3px solid #9A3412; box-sizing: border-box; color: #9A3412; font-family: 'Jua', sans-serif; font-size: 26px">번호가 없어요</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { mode: 'default' };
  }
  renderVals() {
    const m = this.state.mode;
    const err = m === 'error', lock = m === 'lock';
    const digits = err ? ['1','2','3','4','5','6'] : lock ? ['','','','','',''] : ['4','7','','','',''];
    const v = {};
    digits.forEach((d, i) => { v['d' + i] = d; });
    return Object.assign(v, {
      boxBg: lock ? '#E6D9BD' : '#FFFFFF',
      boxBorder: err ? '#B91C1C' : lock ? '#8C7A55' : '#C2410C',
      hintDisplay: m === 'default' ? 'block' : 'none',
      hintText: '틀려도 괜찮아요',
      panelDisplay: m === 'default' ? 'none' : 'flex',
      panelBg: err ? '#FEE2E2' : '#FFFFFF',
      panelBorder: err ? '#B91C1C' : '#8C7A55',
      panelTitle: err ? '번호를 못 알아봤어요' : '잠깐 쉬었다 해요',
      panelBody: err ? '숫자를 다시 확인해 볼까요? 틀려도 괜찮아요' : '조금 뒤에 다시 써 볼까요?',
      btnLabel: err ? '다시 쓰기' : lock ? '알겠어요' : '다음',
      btnBg: '#C2410C', btnColor: '#FFFFFF', btnShadow: '#7C2D12',
      subDisplay: m === 'default' ? 'flex' : 'none',
      mainAction: () => this.setState({ mode: 'default' }),
      goDefault: () => this.setState({ mode: 'default' }),
      goError: () => this.setState({ mode: 'error' }),
      goLock: () => this.setState({ mode: 'lock' })
    });
  }
}
</script>
</body>
</html>
