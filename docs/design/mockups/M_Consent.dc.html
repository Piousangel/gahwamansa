<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>혼합 · 동의</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF1DC; color: #2F2A24; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; position: relative; padding: 56px 24px 28px; gap: 16px">
  <div style="position: absolute; left: 12px; right: 12px; top: 10px; display: flex; gap: 6px; align-items: center"><span style="font-size: 12px; color: #5C4E33; font-weight: 700">[시안 상태 전환]</span><button onClick="{{goAsk}}" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #8C7A55; background: #FFFFFF; color: #2F2A24; font-family: inherit; font-size: 14px; font-weight: 700">묻는 화면</button><button onClick="{{goNo}}" style="height: 32px; padding: 0 10px; border-radius: 16px; border: 1px solid #8C7A55; background: #FFFFFF; color: #2F2A24; font-family: inherit; font-size: 14px; font-weight: 700">싫어요 후</button></div>
  <div style="display: flex; align-items: center; gap: 14px; margin-top: 24px">
    <div style="width: 72px; height: 72px; box-sizing: border-box; flex-shrink: 0; border: 2px dashed #8C7A55; background: #EFE4CC; color: #5C4E33; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 14px; font-weight: 700; line-height: 1.2; ">[해님]<br>기본</div>
    <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 32px; font-weight: 400; line-height: 1.3">{{title}}</h1>
  </div>
  <div style="display: {{askDisplay}}; flex-direction: column; gap: 12px">
    <div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 14px 16px; box-shadow: 0 2px 0 #E3D3B0"><div style="width: 40px; height: 40px; box-sizing: border-box; flex-shrink: 0; border: 2px dashed #8C7A55; background: #EFE4CC; color: #5C4E33; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.2; ">[아이콘:<br>체크]</div><div style="font-size: 22px; font-weight: 500; line-height: 1.4">어르신이 고른 답은 자녀분이 볼 수 있어요</div></div><div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 14px 16px; box-shadow: 0 2px 0 #E3D3B0"><div style="width: 40px; height: 40px; box-sizing: border-box; flex-shrink: 0; border: 2px dashed #8C7A55; background: #EFE4CC; color: #5C4E33; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.2; ">[아이콘:<br>체크]</div><div style="font-size: 22px; font-weight: 500; line-height: 1.4">자녀분은 그 답으로 이야기를 나눠요</div></div><div style="display: flex; align-items: center; gap: 12px; background: #FFFFFF; border-radius: 22px; padding: 14px 16px; box-shadow: 0 2px 0 #E3D3B0"><div style="width: 40px; height: 40px; box-sizing: border-box; flex-shrink: 0; border: 2px dashed #8C7A55; background: #EFE4CC; color: #5C4E33; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; font-weight: 700; line-height: 1.2; ">[아이콘:<br>체크]</div><div style="font-size: 22px; font-weight: 500; line-height: 1.4">다른 사람에게는 보이지 않아요</div></div>
    <div style="font-size: 20px; font-weight: 500; color: #5C4E33; line-height: 1.4; padding: 0 4px">마음이 바뀌면 자녀분께 말씀해 주세요</div>
  </div>
  <div style="display: {{noDisplay}}; flex-direction: column; gap: 10px; background: #FFFFFF; border: 3px solid #8C7A55; border-radius: 22px; padding: 18px 16px">
    <div style="font-family: 'Jua', sans-serif; font-size: 28px; line-height: 1.35">괜찮아요. 앱은 그대로 쓸 수 있어요</div>
    <div style="font-size: 22px; font-weight: 500; line-height: 1.4">대신 고른 답은 저장되지 않아요</div>
  </div>
  <div style="flex-grow: 1"></div>
  <div style="display: {{askDisplay}}; flex-direction: column; gap: 12px">
    <button onClick="{{accept}}" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 36px; border: none; background: #C2410C; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 32px; box-shadow: 0 4px 0 #7C2D12">좋아요</button>
    <button onClick="{{decline}}" style="display: flex; align-items: center; justify-content: center; height: 64px; border-radius: 32px; background: #FFFFFF; border: 3px solid #9A3412; box-sizing: border-box; color: #9A3412; font-family: 'Jua', sans-serif; font-size: 26px">싫어요</button>
  </div>
  <div style="display: {{noDisplay}}; flex-direction: column; gap: 12px">
    <a href="M_Photo.dc.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 36px; background: #C2410C; color: #FFFFFF; font-family: 'Jua', sans-serif; font-size: 32px; text-decoration: none; box-shadow: 0 4px 0 #7C2D12">알겠어요</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { declined: false };
  }
  renderVals() {
    const d = this.state.declined;
    return {
      title: d ? '답을 남기지 않기로 했어요' : '고른 답이 자녀분께 보여요',
      askDisplay: d ? 'none' : 'flex',
      noDisplay: d ? 'flex' : 'none',
      accept: () => { window.location.href = 'M_Photo.dc.html'; },
      decline: () => this.setState({ declined: true }),
      goAsk: () => this.setState({ declined: false }),
      goNo: () => this.setState({ declined: true })
    };
  }
}
</script>
</body>
</html>
