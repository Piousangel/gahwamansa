<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>혼합 · 밸런스 질문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FBF1DC; color: #2F2A24; font-family: 'Noto Sans KR', sans-serif; display: flex; flex-direction: column; padding: 56px 24px 28px; gap: 16px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: 'Jua', sans-serif; font-size: 26px; color: #9A3412">2단계 · 어느 쪽이 좋으세요?</div>
    <div style="font-size: 20px; color: #5C4E33; font-weight: 700">2 / 3</div>
  </div>

  <h1 style="margin: 0; font-family: 'Jua', sans-serif; font-size: 36px; font-weight: 400; line-height: 1.3">여름 나들이는<br>어디가 좋으세요?</h1>

  <div style="display: flex; align-items: center; gap: 12px">
    <svg width="56" height="56" viewBox="0 0 92 92" fill="none" aria-hidden="true" style="flex-shrink: 0">
      <g stroke="#F59E0B" stroke-width="5" stroke-linecap="round">
        <path d="M46 4v8M46 80v8M4 46h8M80 46h8M16 16l6 6M70 70l6 6M16 76l6-6M70 22l6-6"/>
      </g>
      <circle cx="46" cy="46" r="30" fill="#FFC93C"/>
      <circle cx="36" cy="42" r="3.5" fill="#2F2A24"/>
      <circle cx="56" cy="42" r="3.5" fill="#2F2A24"/>
      <circle cx="30" cy="52" r="5" fill="#FF9E7A"/>
      <circle cx="62" cy="52" r="5" fill="#FF9E7A"/>
      <path d="M36 55c5 6 15 6 20 0" stroke="#2F2A24" stroke-width="3.5" stroke-linecap="round"/>
    </svg>
    <div style="font-size: 20px; font-weight: 500; line-height: 1.4; color: #5C4E33">정답은 없어요. 마음 가는 대로 눌러 보세요.</div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 14px">
    <button onClick="{{seaPick}}" style="min-height: 132px; border-radius: 24px; box-sizing: border-box; padding: 16px 18px; background: {{seaBg}}; border: 4px solid {{seaBorder}}; color: #2F2A24; font-family: inherit; display: flex; align-items: center; gap: 14px; text-align: left; box-shadow: 0 3px 0 #E3D3B0">
        <div style="width: 72px; height: 72px; border-radius: 12px; background: #FFFFFF; border: 2px solid #8C7A55; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2F2A24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 9c2.5-2 4.5-2 7 0s4.5 2 7 0 4-2 6 0"/><path d="M2 15c2.5-2 4.5-2 7 0s4.5 2 7 0 4-2 6 0"/></svg></div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
          <div style="font-family: 'Jua', sans-serif; font-size: 30px">시원한 바닷가</div>
          <div style="font-size: 20px; color: #5C4E33; font-weight: 500">파도 소리 들으며</div>
        </div>
        <div style="width: 40px; height: 40px; border-radius: 20px; background: {{seaDot}}; border: 3px solid #C2410C; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: {{seaOp}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </button>
    <button onClick="{{mtnPick}}" style="min-height: 132px; border-radius: 24px; box-sizing: border-box; padding: 16px 18px; background: {{mtnBg}}; border: 4px solid {{mtnBorder}}; color: #2F2A24; font-family: inherit; display: flex; align-items: center; gap: 14px; text-align: left; box-shadow: 0 3px 0 #E3D3B0">
        <div style="width: 72px; height: 72px; border-radius: 12px; background: #FFFFFF; border: 2px solid #8C7A55; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center"><svg width="44" height="44" viewBox="0 0 24 24" fill="none" stroke="#2F2A24" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 19l7-12 4 7 3-4 6 9z"/></svg></div>
        <div style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
          <div style="font-family: 'Jua', sans-serif; font-size: 30px">조용한 산골짜기</div>
          <div style="font-size: 20px; color: #5C4E33; font-weight: 500">계곡물에 발 담그고</div>
        </div>
        <div style="width: 40px; height: 40px; border-radius: 20px; background: {{mtnDot}}; border: 3px solid #C2410C; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; opacity: {{mtnOp}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#FFFFFF" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      </button>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Hangul.dc.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 36px; background: {{btnBg}}; color: {{btnColor}}; font-family: 'Jua', sans-serif; font-size: 32px; text-decoration: none; pointer-events: {{btnPe}}; box-shadow: 0 4px 0 {{btnShadow}}">{{btnLabel}}</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    const p = this.state.picked;
    const ready = !!p;
    const f = (id) => {
      const on = p === id;
      return { bg: on ? '#FFD9C2' : '#FFFFFF', border: on ? '#C2410C' : '#8C7A55', dot: on ? '#C2410C' : '#FFFFFF', op: on ? 1 : 0 };
    };
    const sea = f('sea'), mtn = f('mtn');
    return {
      seaBg: sea.bg, seaBorder: sea.border, seaDot: sea.dot, seaOp: sea.op,
      mtnBg: mtn.bg, mtnBorder: mtn.border, mtnDot: mtn.dot, mtnOp: mtn.op,
      seaPick: () => this.setState({ picked: 'sea' }),
      mtnPick: () => this.setState({ picked: 'mtn' }),
      btnLabel: ready ? '이걸로 정했어요' : '하나를 골라 주세요',
      btnBg: ready ? '#C2410C' : '#E6D9BD',
      btnColor: ready ? '#FFFFFF' : '#5C4E33',
      btnShadow: ready ? '#7C2D12' : '#D2C29D',
      btnPe: ready ? 'auto' : 'none'
    };
  }
}
</script>
</body>
</html>
