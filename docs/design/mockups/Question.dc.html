<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>밸런스 질문</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FAFAF7; color: #1B1B18; font-family: 'Noto Sans KR', sans-serif; padding: 56px 24px 28px; display: flex; flex-direction: column; gap: 20px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-size: 20px; font-weight: 700; color: #1F6F5C">2단계 · 어느 쪽이 좋으세요?</div>
    <div style="font-size: 20px; color: #55524A; font-weight: 500">2 / 3</div>
  </div>

  <h1 style="margin: 0; font-size: 34px; font-weight: 900; line-height: 1.3">여름 나들이는<br>어디가 좋으세요?</h1>

  <div style="display: flex; flex-direction: column; gap: 16px">
    <sc-for list="{{options}}" as="o" hint-placeholder-count="2">
      <button onClick="{{o.pick}}" style="min-height: 150px; border-radius: 24px; box-sizing: border-box; padding: 20px; background: {{o.bg}}; border: 4px solid {{o.border}}; color: #1B1B18; font-family: inherit; display: flex; align-items: center; gap: 16px; text-align: left">
        <div style="width: 48px; height: 48px; border-radius: 24px; background: {{o.dot}}; border: 3px solid #1F6F5C; box-sizing: border-box; flex-shrink: 0; display: flex; align-items: center; justify-content: center; color: #FFFFFF; font-size: 26px; font-weight: 900">{{o.mark}}</div>
        <div style="display: flex; flex-direction: column; gap: 4px">
          <div style="font-size: 30px; font-weight: 900">{{o.title}}</div>
          <div style="font-size: 20px; color: #55524A; font-weight: 500">{{o.sub}}</div>
        </div>
      </button>
    </sc-for>
  </div>

  <div style="flex-grow: 1"></div>

  <a href="Hangul.dc.html" style="display: flex; align-items: center; justify-content: center; height: 72px; border-radius: 36px; background: #1F6F5C; color: #FFFFFF; font-size: 26px; font-weight: 900; text-decoration: none; opacity: {{btnOpacity}}">이걸로 정했어요</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'sea' };
  }
  renderVals() {
    const picked = this.state.picked;
    const defs = [
      { id: 'sea', title: '시원한 바닷가', sub: '파도 소리 들으며' },
      { id: 'mountain', title: '조용한 산골짜기', sub: '계곡물에 발 담그고' }
    ];
    const options = defs.map((d) => {
      const on = picked === d.id;
      return {
        title: d.title,
        sub: d.sub,
        bg: on ? '#E3F0EC' : '#FFFFFF',
        border: on ? '#1F6F5C' : '#D9D6CC',
        dot: on ? '#1F6F5C' : '#FFFFFF',
        mark: on ? '✓' : '',
        pick: () => this.setState({ picked: d.id })
      };
    });
    return { options, btnOpacity: picked ? 1 : 0.45 };
  }
}
</script>
</body>
</html>
