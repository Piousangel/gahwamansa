<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF1DC;color:#2F2A24;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden"><div style="position:absolute;top:12px;right:12px;padding:2px 6px;border:1px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;font-size:11px;font-weight:700;border-radius:4px">[문구 확정 필요]</div><div style="flex:1;min-height:0;overflow-y:hidden;padding:56px 20px 14px;display:flex;flex-direction:column;gap:14px;"><div style="display:flex;gap:6px"><div style="flex:1;padding:6px 4px;border-radius:12px;background:#CDEBDD;border:2px solid #8C7A55;text-align:center;font-size:16px;font-weight:700;color:#14532D;line-height:1.2">로그인<br><span style="font-weight:500">완료</span></div><div style="flex:1;padding:6px 4px;border-radius:12px;background:#CDEBDD;border:2px solid #8C7A55;text-align:center;font-size:16px;font-weight:700;color:#14532D;line-height:1.2">가족 만들기<br><span style="font-weight:500">완료</span></div><div style="flex:1;padding:6px 4px;border-radius:12px;background:#FFD9C2;border:2px solid #C2410C;text-align:center;font-size:16px;font-weight:700;color:#2F2A24;line-height:1.2">번호 알리기<br><span style="font-weight:500">지금</span></div></div><div style="font-family:'Jua',sans-serif;font-size:30px;font-weight:400;color:#2F2A24;line-height:1.3;">어르신께 이 번호를<br>알려 주세요</div><div style="font-size:16px;font-weight:500;color:#5C4E33;line-height:1.5;">어르신 폰 앱에서 번호를 입력하면 바로 연결돼요</div><div style="background:#FFFFFF;border:none;border-radius:16px;padding:16px;box-shadow:0 2px 0 #E3D3B0;display:flex;flex-direction:column;gap:12px;"><div style="display:flex;justify-content:space-between;gap:6px"><div style="width:48px;height:72px;box-sizing:border-box;border-radius:12px;background:#FFFFFF;border:3px solid #8C7A55;display:flex;align-items:center;justify-content:center;font-family:'Jua',sans-serif;font-size:44px;color:#2F2A24;">4</div><div style="width:48px;height:72px;box-sizing:border-box;border <script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
