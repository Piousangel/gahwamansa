<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>C4 자녀 홈 · 오늘 참여 완료(응원 눌러 보기)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF1DC;color:#2F2A24;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;position:relative;overflow:hidden"><div style="position:absolute;top:12px;right:12px;padding:2px 6px;border:1px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;font-size:11px;font-weight:700;border-radius:4px">[문구 확정 필요]</div><div style="flex:1;min-height:0;overflow-y:hidden;padding:56px 20px 12px;display:flex;flex-direction:column;gap:14px;"><div style="display:flex;flex-direction:column;gap:2px"><div style="font-family:'Nanum Pen Script',cursive;font-size:26px;color:#6B4F25;line-height:1">11월 17일 화요일</div><div style="font-family:'Jua',sans-serif;font-size:30px;font-weight:400;color:#2F2A24;line-height:1.3;">엄마의 앨범</div><div style="font-size:18px;font-weight:700;color:#2F2A24;line-height:1.5;">엄마가 오늘도 참여하셨어요</div></div><div style="background:#FFFFFF;border:none;border-radius:16px;padding:14px;box-shadow:0 2px 0 #E3D3B0;display:flex;flex-direction:column;gap:10px;"><div style="display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap"><div style="font-size:18px;font-weight:700;color:#14532D;line-height:1.5;">오늘 코스 3/3 완료</div><div style="font-size:16px;font-weight:700;color:#5C4E33;line-height:1.5;">5일 연속</div></div><div style="display:flex;gap:8px"><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0;background:#CDEBDD;color:#14532D;border:none;border-radius:12px;padding:8px 2px;font-size:16px;font-weight:700;line-height:1.3;box-sizing:border-box"><span>사진</span><span style="font-weight:500">완료</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0;background:#CDEBDD;color:#14532D;border:none;border-radius:12px;padding:8px 2px;font-size:16px;font-weight:700;line-height:1.3;box-sizing:border-box"><span>질문</span><span style="font-weight:500">완료</span></div><div style="flex:1;display:flex;flex-direction:column;align-items:center;gap:0;background:#CDEBDD;color:#14532D;border:none;border-radius:12px;padding:8px 2px;font-size:16px;font-weight:700;line-height:1.3;box-sizing:border-box"><span>글씨</span><span style="font-weight:500">완료</span></div></div></div><div style="background:#FFFFFF;border:none;border-radius:16px;padding:14px;box-shadow:0 2px 0 #E3D3B0;display:flex;flex-direction:column;gap:10px;"><div style="display:flex;gap:14px;align-items:center"><div style="width:84px;flex-shrink:0;background:#FFFFFF;padding:6px 6px 10px;box-shadow:0 3px 8px rgba(92,78,51,0.3);transform:rotate(-3deg)"><div style="width:100%;height:64px;box-sizing:border-box;flex-shrink:0;border:2px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;display:flex;align-items:center;justify-content:center;text-align:center;font-size:11px;font-weight:700;line-height:1.2;">[사진 자리]</div><div style="font-family:'Nanum Pen Script',cursive;font-size:20px;color:#6B4F25;text-align:center;line-height:1;margin-top:4px">시장 골목</div></div><div style="display:flex;flex-direction:column;gap:4px"><div style="font-size:16px;font-weight:500;color:#5C4E33;line-height:1.5;">오늘 엄마의 선택</div><div style="font-size:20px;font-weight:900;color:#2F2A24;line-height:1.3;">여름 나들이는 시원한 바닷가</div><div style="font-size:16px;font-weight:500;color:#5C4E33;line-height:1.5;">시장 골목 얘기를 꺼내 보세요</div></div></div></div><div style="display:flex;flex-direction:column;gap:8px"><div style="font-size:18px;font-weight:700;color:#2F2A24;line-height:1.5;">응원 한마디 보내기</div><sc-for list="{{cheers}}" as="c" hint-placeholder-count="2"><div onClick="{{c.pick}}" style="min-height:48px;box-sizing:border-box;display:flex;align-items:center;justify-content:space-between;gap:8px;padding:8px 14px;border-radius:22px;background:{{c.bg}};border:2px solid {{c.border}};font-size:16px;font-weight:700;color:#2F2A24;line-height:1.35"><span>{{c.label}}</span><span style="color:#9A3412;font-weight:900">{{c.mark}}</span></div></sc-for><div style="min-height:48px;display:flex;align-items:center;justify-content:flex-start;font-size:16px;font-weight:700;color:#9A3412;text-decoration:underline;">다른 문구 8개 보기</div><button onClick="{{send}}" style="min-height:56px;width:100%;box-sizing:border-box;padding:8px 16px;border-radius:28px;background:{{sendBg}};color:{{sendColor}};border:none;font-family:'Jua',sans-serif;font-size:24px;line-height:1.25;box-shadow:{{sendShadow}};">{{sendLabel}}</button></div></div><div style="display:flex;border-top:2px solid #D9CBB0;background:#FFFFFF;padding:8px 20px 24px;gap:8px;flex-shrink:0"><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:#9A3412;font-size:16px;font-weight:900"><div style="width:26px;height:26px;box-sizing:border-box;flex-shrink:0;border:2px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:700;line-height:1.2;">[아이콘: 홈]</div>홈</div><div style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:56px;color:#5C4E33;font-size:16px;font-weight:700"><div style="width:26px;height:26px;box-sizing:border-box;flex-shrink:0;border:2px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;display:flex;align-items:center;justify-content:center;text-align:center;font-size:8px;font-weight:700;line-height:1.2;">[아이콘: 리포트]</div>리포트</div></div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { picked: -1, sent: false }; }
  renderVals() {
    const labels = ['오늘도 사진 보러 와 주셔서 고마워요', '오늘 고른 답이 궁금해요, 이따 이야기해요'];
    const p = this.state.picked, sent = this.state.sent;
    const cheers = labels.map((label, i) => {
      const on = p === i;
      return { label, bg: on ? '#FFD9C2' : '#FFFFFF', border: on ? '#C2410C' : '#8C7A55', mark: on ? '선택됨' : '',
        pick: () => this.setState({ picked: i, sent: false }) };
    });
    const ready = p >= 0;
    return { cheers,
      sendLabel: sent ? '보냈어요' : (ready ? '보내기' : '하나를 골라 주세요'),
      sendBg: sent ? '#166534' : (ready ? '#C2410C' : '#E6D9BD'),
      sendColor: sent ? '#FFFFFF' : (ready ? '#FFFFFF' : '#5C4E33'),
      sendShadow: ready && !sent ? '0 3px 0 #7C2D12' : 'none',
      send: () => { if (this.state.picked >= 0) this.setState({ sent: true }); } };
  }
}
</script>
</body>
</html>
