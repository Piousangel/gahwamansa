<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>P5_unselected · 선택 전(버튼 비활성)</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Jua&family=Nanum+Pen+Script&display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="width:390px;height:844px;box-sizing:border-box;background:#FBF1DC;color:#2F2A24;font-family:'Noto Sans KR',sans-serif;display:flex;flex-direction:column;position:relative;padding:56px 24px 28px;gap:16px"><div style="position:absolute;left:24px;top:14px;right:24px;font-size:12px;font-weight:700;color:#5C4E33">[시안 메모] P5 선택 전(버튼 비활성) · 카드를 눌러 선택 가능(다시 누르면 바뀜)</div><div style="display:flex;align-items:center;justify-content:space-between"><div style="font-family:'Jua',sans-serif;font-size:26px;color:#9A3412">2단계 · 질문 고르기</div><div style="font-size:20px;color:#5C4E33;font-weight:700">2 / 3</div></div><h1 style="margin:0;font-family:'Jua',sans-serif;font-size:36px;font-weight:400;line-height:1.3">더 좋아하는 계절은<br>어느 쪽이세요?</h1><div style="display:flex;align-items:center;gap:12px"><div style="width:56px;height:56px;box-sizing:border-box;flex-shrink:0;border:2px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;display:flex;align-items:center;justify-content:center;text-align:center;font-size:12px;font-weight:700;line-height:1.2">[해님:<br>기본]</div><div style="font-size:20px;font-weight:500;line-height:1.4;color:#5C4E33">정답은 없어요. 마음 가는 쪽을 눌러 주세요</div></div><div style="display:flex;flex-direction:column;gap:14px"><div role="button" onClick="{{aPick}}" style="min-height:132px;border-radius:24px;box-sizing:border-box;padding:16px 18px;background:{{aBg}};border:4px solid {{aBd}};display:flex;align-items:center;gap:14px;box-shadow:0 3px 0 #E3D3B0"><div style="font-family:'Jua',sans-serif;font-size:34px;flex-grow:1;line-height:1.25">봄</div><div style="width:40px;height:40px;border-radius:20px;background:#fff;border:3px solid #8C7A55;box-sizing:border-box;flex-shrink:0;position:relative"><div style="position:absolute;left:-3px;top:-3px"><div style="width:40px;height:40px;flex-shrink:0;opacity:{{aOp}}"><div style="width:40px;height:40px;box-sizing:border-box;flex-shrink:0;border:2px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:700;line-height:1.2">[아이콘:<br>체크]</div></div></div></div></div><div role="button" onClick="{{bPick}}" style="min-height:132px;border-radius:24px;box-sizing:border-box;padding:16px 18px;background:{{bBg}};border:4px solid {{bBd}};display:flex;align-items:center;gap:14px;box-shadow:0 3px 0 #E3D3B0"><div style="font-family:'Jua',sans-serif;font-size:34px;flex-grow:1;line-height:1.25">가을</div><div style="width:40px;height:40px;border-radius:20px;background:#fff;border:3px solid #8C7A55;box-sizing:border-box;flex-shrink:0;position:relative"><div style="position:absolute;left:-3px;top:-3px"><div style="width:40px;height:40px;flex-shrink:0;opacity:{{bOp}}"><div style="width:40px;height:40px;box-sizing:border-box;flex-shrink:0;border:2px dashed #8C7A55;background:#EFE4CC;color:#5C4E33;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:700;line-height:1.2">[아이콘:<br>체크]</div></div></div></div></div></div><div style="flex-grow:1"></div><div role="button" style="display:flex;align-items:center;justify-content:center;height:72px;border-radius:36px;box-sizing:border-box;background:{{btnBg}};color:{{btnColor}};font-family:'Jua',sans-serif;font-size:32px;box-shadow:0 4px 0 {{btnShadow}}">{{btnLabel}}</div></div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: null };
  }
  renderVals() {
    const p = this.state.picked;
    const f = (id) => { const on = p === id; return { bg: on ? '#FFD9C2' : '#FFFFFF', bd: on ? '#C2410C' : '#8C7A55', op: on ? 1 : 0 }; };
    const a = f('a'), b = f('b');
    const ready = !!p;
    return {
      aBg: a.bg, aBd: a.bd, aOp: a.op, bBg: b.bg, bBd: b.bd, bOp: b.op,
      aPick: () => this.setState({ picked: 'a' }),
      bPick: () => this.setState({ picked: 'b' }),
      btnLabel: ready ? '정했어요' : '하나를 골라 주세요',
      btnBg: ready ? '#C2410C' : '#E6D9BD',
      btnColor: ready ? '#FFFFFF' : '#5C4E33',
      btnShadow: ready ? '#7C2D12' : '#D2C29D'
    };
  }
}
</script>
</body>
</html>
