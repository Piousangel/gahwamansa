<!--
FS C · 브랜드(배민안) 390x844.
문구: 패널 제안 그대로. 라이터 확정 전.
배민 패널: 심볼+워드마크+한 줄 "가족 사진이 하루 한 장씩 모이는 앨범", 기운 폴라로이드 1장(content/photos/day-01.jpg를 480px로 줄여 base64 인라인) + 손글씨 "오늘의 한 장" + "AI가 만든 그림" 표기, 질문 "어떻게 시작할까요?" + [번호를 받았어요 / 가족이 보내 준 번호로 시작] [가족에게 번호를 보낼게요 / 부모님께 보낼 번호를 만들어요]. 주 버튼 제목은 SYNTHESIS 표(배민 원문은 "받은 번호가 있어요"), 보조 버튼 둘째 줄은 배민 원문에 없어 토스 문구를 빌림.
공통: 해님 말 없음(얼굴 없는 해+폴라로이드 심볼만 작게, design-system/assets/symbol-sun-polaroid.svg), 버튼 하단 고정, 설명은 버튼 안 둘째 줄, 하단 여백 64 = 16 + 안드로이드 3버튼 내비게이션 바 48(가정, components/README §19-b). 맨 아래 연한 내비게이션 표시는 위치 확인용 그림이며 앱에 그리지 않음.
글자: 제목 Jua 34(C 질문 28), 버튼 제목 30/28, 둘째 줄·설명 20 이상. 버튼 최소 높이 88. 대비: 흰/#744821 7.80, #F1E4D4/#744821 6.24, #4E2F14/흰 12.06, #85592F/흰 6.06, #744821/종이 7.05, #85592F/종이 5.47.
-->
