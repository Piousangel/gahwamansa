FS D · 앨범 펼침(추천) 390x844. 2026-11-17 첫 화면 개선 라운드(사용자: "너무 노멀, 단조로움").
문구: 확정 문구(copy-v3-confirmed §8·§9) 그대로. 캡션 "마을 입구 나무"와 사진 아래 "AI가 만든 그림" 줄은 뺐다(캡션은 문구 삭제 제안, 라이터 확인 필요).
바뀐 점(현 앱 RoleSelect 대비): ① 소개 아이콘 3개를 색 원(36, 아이콘 22 #4E2F14)에 넣음: 사진=accentSun #FFE29A(제안), 연필=sky #CFE6F7(기존 "한글 쓰기 단계 면"과 같은 색), 가족=accentPeach #FFD6C2(제안). 아이콘/원 대비 9.5·9.4·9.0. 초록은 "완료" 의미라 쓰지 않음. ② 사진 1장 → 폴라로이드 3장 겹침(앞 day-01, 뒤 왼쪽 day-02 -9°, 뒤 오른쪽 day-09 +8°), 앞 사진 테이프, 캡션 없음. ③ AI 고지: 앞 사진 틀 아래 흰 띠 오른쪽 "AI" 칩(20px 굵게 #85592F on #EFE9E0, 5.02). 사진 위에는 글자를 올리지 않음(폴라로이드 규칙). 화면 읽기 라벨 "옛날 사진 예시, AI가 만든 그림" 유지.
크기: 앞 사진 폭 = min(영역 폭 44%, (영역 높이-62)*1.2414), 영역 높이 104 이하면 숨김. 글자 130% 이상 사진 숨김, 150% 이상 항목 숨김(현 앱 규칙 유지).
모션(첫 진입 1회, 버튼은 처음부터 정지·바로 누를 수 있음):
| 대상 | 속성 | 시간 | 이징 | 지연 |
| 심볼 | opacity 0→1, translateY 8→0 | 450 | (.4,0,.2,1) | 0 |
| 항목 3줄 | opacity 0→1, translateX -8→0 | 300 | (.4,0,.2,1) | 150/270/390 |
| 아이콘 원 3개 | opacity 0→1, scale .6→1 | 300 | (.2,.8,.2,1) | 150/230/310 |
| 앞 폴라로이드 | opacity 0→1, translateY -20→0, scale 1.04→1 (내려앉음) | 450 | (.4,0,.2,1) | 200 |
| 뒤 폴라로이드 2장 | opacity 0→1, rotate -2°→-9°/+8°, translateX 0→∓31% (펼침) | 450 | (.4,0,.2,1) | 520/580 |
| 앞 사진 인화 | 사진 위 #EFE9E0 면 opacity 1→0 | 1200 | (0,0,.2,1) | 450 |
