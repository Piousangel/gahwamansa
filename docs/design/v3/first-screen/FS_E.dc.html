<!--
FS E · 하루 코스 잇기 390x844. 2026-11-17 첫 화면 개선 라운드.
문구: 확정 문구 그대로. 캡션·"AI가 만든 그림" 줄 뺌.
바뀐 점: ① 아이콘 색 원(D와 같은 색) + 원 사이 점선 바늘땀(#D8C6B0, 장식)으로 "사진→글씨→답" 하루 순서를 잇는다. ② 사진은 1장을 크게(영역 폭 52%까지), 뒤에 해 원(accentSun #FFE29A)이 떠오름 = 심볼(해+폴라로이드)을 화면 크기로 키운 구도. ③ AI 칩은 D와 같음.
크기: 앞 사진 폭 = min(영역 폭 52%, (영역 높이-52)*1.2414), 영역 96 이하면 사진·해 원 숨김.
모션(1회):
| 대상 | 속성 | 시간 | 이징 | 지연 |
| 심볼 | opacity, translateY 8→0 | 450 | (.4,0,.2,1) | 0 |
| 항목 3줄 | opacity, translateX -8→0 | 300 | (.4,0,.2,1) | 150/270/390 |
| 아이콘 원 | opacity, scale .6→1 | 300 | (.2,.8,.2,1) | 150/230/310 |
| 바늘땀 | scaleY 0→1(위에서 아래) | 600 | (.4,0,.2,1) | 300 |
| 해 원 | opacity, translateY 24→0 (떠오름) | 600 | (.4,0,.2,1) | 100 |
| 폴라로이드 | opacity, translateY -20→0, scale 1.04→1 | 450 | (.4,0,.2,1) | 200 |
| 인화 | 덮개 opacity 1→0 | 1200 | (0,0,.2,1) | 450 |
동작 줄이기: 전부 opacity 300ms, 바늘땀은 처음부터 보임.
약점: 한 줄 항목에서는 원끼리 가까워 바늘땀이 거의 안 보인다(360 이상). 순서 표현은 숫자 없이 약함.
-->
