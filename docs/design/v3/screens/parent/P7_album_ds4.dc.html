DS v4 어르신 시안 3차 · P7 완료(앨범 물건 한 곳에 크게, IDENTITY-REVIEW 방법 1, 2026-11-19).
- 사진 한 장(마운트 모서리) + 테이프 + 큰 인장(家) 도장을 비스듬히 얹어 '앨범에 도장 찍은 한 장'으로 읽히게 했다. 기존 P7_motion 도장 '쾅'(300ms 이상 페이드, 동작 줄이기는 즉시)을 그대로 쓰고 사진·테이프가 먼저 놓인 뒤 도장이 마지막에 찍힌다(연출 순서만 변경, 문구·시간 불변).
- 칭찬·연속 보상 금지: 큰 도장은 '오늘 찍힌 사실'이고 개수·연속일·점수 표현이 없다. 이번 주 도장 줄은 사실 그대로(첫날 1개, 평소 오늘까지).
