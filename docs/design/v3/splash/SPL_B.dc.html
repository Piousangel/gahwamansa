<!--
SPL B · 심볼 + 아래 워드마크(브랜딩 이미지). A와 같고, Android 12+ windowSplashScreenBrandingImage(200x80dp)에 워드마크 "가화만사성"(32, #4E2F14, 글자를 벡터 경로로 바꾼 drawable)을 넣는다. 아래 여백 = 내비게이션 바 + 24.
장점: 처음 보는 사람도 앱 이름을 바로 읽는다. 단점: 브랜딩 이미지는 compat(Android 11 이하)에서 안 보여 기기마다 모습이 달라진다. 첫 화면 위쪽 워드마크와 이름이 두 번 연달아 나오고, 워드마크가 아래에서 위로 이어지지 않아 끊겨 보인다. 글꼴 라이선스가 미확인이라 글자 벡터화도 미정이다.
-->

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet"><style>body{margin:0}
.ab{--ease:cubic-bezier(.4,0,.2,1);--out:cubic-bezier(.2,.8,.2,1)}
.ab *{box-sizing:border-box}
.area{flex:1;min-height:0;container-type:size;position:relative}
.stack{position:absolute;left:50%;top:50%;width:var(--pol);height:calc(var(--pw) / 1.2414 + 8px + var(--strip));transform:translate(-50%,-50%)}
.pol{position:absolute;inset:0;background:#FFFFFF;border-radius:3px;padding:8px 8px 0;box-shadow:0 6px 16px rgba(116,72,33,.26)}
.pol .ph{position:relative;width:100%;aspect-ratio:1152/928;overflow:hidden;background:#EFE9E0}
.pol img{display:block;width:100%;height:100%;object-fit:cover}
.pol .dev{position:absolute;inset:0;background:#EFE9E0}
.pol .strip{height:var(--strip);display:flex;align-items:center;justify-content:flex-end;padding-right:2px}
.ai{font:700 20px/24px 'Noto Sans KR',sans-serif;color:#85592F;background:#EFE9E0;border-radius:8px;padding:0 6px;letter-spacing:0}
.tape{position:absolute;left:50%;top:-12px;width:calc(var(--pol) * .42);height:22px;background:rgba(234,219,196,.92);transform:translateX(-50%) rotate(3deg);box-shadow:0 1px 2px rgba(116,72,33,.12)}
.circ{flex-shrink:0;width:36px;height:36px;border-radius:18px;display:flex;align-items:center;justify-content:center}
/* 재생(첫 진입 1회) */
.ab.play .m-sym{animation:rise 450ms var(--ease) 0ms both}
.ab.play .m-c0{animation:pop 300ms var(--out) 150ms both}
.ab.play .m-c1{animation:pop 300ms var(--out) 230ms both}
.ab.play .m-c2{animation:pop 300ms var(--out) 310ms both}
.ab.play .m-front{animation:settle 450ms var(--ease) 200ms both}
.ab.play .m-b1{animation:fanL 450ms var(--ease) 520ms both}
.ab.play .m-b2{animation:fanR 450ms var(--ease) 580ms both}
.ab.play .m-dev{animation:develop 1200ms cubic-bezier(0,0,.2,1) 450ms both}
.ab.play .m-disc{animation:sunup 600ms var(--ease) 100ms both}
.ab.play .m-row0{animation:slidein 300ms var(--ease) 150ms both}
.ab.play .m-row1{animation:slidein 300ms var(--ease) 270ms both}
.ab.play .m-row2{animation:slidein 300ms var(--ease) 390ms both}
.ab.play .m-stitch{animation:grow 600ms var(--ease) 300ms both}
.ab.play .m-panel{animation:fade 300ms var(--ease) 0ms both}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
@keyframes settle{from{opacity:0;transform:translateY(-20px) rotate(var(--rot)) scale(1.04)}to{opacity:1;transform:rotate(var(--rot))}}
@keyframes fanL{from{opacity:0;transform:rotate(-2deg)}to{opacity:1;transform:var(--fan)}}
@keyframes fanR{from{opacity:0;transform:rotate(-2deg)}to{opacity:1;transform:var(--fan)}}
@keyframes develop{from{opacity:1}to{opacity:0}}
@keyframes sunup{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
@keyframes slidein{from{opacity:0;transform:translateX(-8px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes fade{from{opacity:0}to{opacity:1}}
/* 동작 줄이기: 움직임·크기 변화 제거, 불투명도만 300ms(인화 효과도 300ms 페이드로 대체) */
@media (prefers-reduced-motion: reduce){
 .ab.play [class*="m-"]{animation:fade 300ms linear 0ms both!important}
 .ab.play .m-dev{animation:develop 300ms linear 0ms both!important}
 .ab.play .m-stitch{animation:none!important}
}
.ab.still .m-dev{display:none}
