<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A1 일력 · P7 완료(도장)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Gothic+A1:wght@400;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&text=%E5%AE%B6&display=block" rel="stylesheet">
<link rel="stylesheet" href="../common/frame.css"><link rel="stylesheet" href="style.css">
</head><body>
<div class="phone">
  <div class="scroll">
    <div class="sheet">
      <div class="bind" aria-hidden="true"></div>
      <div class="hdr blk"><span class="t-heading">11월</span><span class="t-heading">금요일</span></div>
      <!-- 대담한 한 곳: 오늘 숫자 위에 家 도장. 달력 날짜에 동그라미 치던 손버릇을 도장으로 -->
      <div class="date blk" style="position:relative">
        <span class="num big t-display" aria-label="20일">20</span>
        <span class="stamp anim" aria-hidden="true" style="left:92px;top:2px">家</span>
      </div>
      <p class="t-sub sub blk" style="padding-top:8px">음력 10월 12일</p>
      <div class="perf" aria-hidden="true"><i></i><i></i></div>
      <h1 class="t-title blk">오늘 코스를 마쳤어요</h1>
      <div class="word blk"><span class="t-sub sub">오늘 쓰신 낱말</span><span class="t-heading w">감</span></div>
      <p class="t-body blk">고르신 답은 가족이 볼 수 있어요</p>
      <p class="t-sub sub blk">내일 아침에 새 장이 나와요</p>
    </div>
  </div>
  <div class="more" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="dock"><a class="btn t-btn tap" data-min="72" href="#">알겠어요</a></div>
  <div class="sian">시안 예시 문구(답 공유 동의한 경우)</div>
</div>
<script src="../common/frame.js"></script>
</body></html>
