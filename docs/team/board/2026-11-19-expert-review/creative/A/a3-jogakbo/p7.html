<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>A3 조각보 · P7 완료(도장)</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hahmlet:wght@400;700&family=IBM+Plex+Sans+KR:wght@400;700&display=block" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@700&text=%E5%AE%B6&display=block" rel="stylesheet">
<link rel="stylesheet" href="../common/frame.css"><link rel="stylesheet" href="style.css">
<style>
  .sq{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:auto auto;border:2px solid var(--stitch);position:relative;margin-top:20px}
  .sq .ph{grid-row:span 2;padding:8px;background:var(--white);position:relative}
  .sq .ph img{width:100%;height:100%;min-height:150px;object-fit:cover}
  .sq .ph::after{content:"";position:absolute;inset:3px;border:2px dashed var(--stitch)}
  html.fs2 .sq{grid-template-columns:1fr}
  html.fs2 .sq .ph{grid-row:auto}
</style>
</head><body>
<div class="phone">
  <div class="scroll">
    <!-- 대담한 한 곳: 오늘 세 조각(사진·고른 답·쓴 낱말)이 한 장으로 이어지고 모서리에 家 도장 -->
    <div class="sq blk">
      <figure class="ph"><img src="../../../../../../../content/photos/day-04.jpg" alt="오늘 사진, 감 익는 마당"></figure>
      <div class="pc chija" data-bg="#E2B23A"><span class="t-sub">고르신 것</span><span class="t-heading">홍시</span></div>
      <div class="pc ssuk" data-bg="#3E5530"><span class="t-sub">쓰신 낱말</span><span class="t-heading">감</span></div>
      <span class="seal anim" aria-hidden="true" style="right:-10px;bottom:-22px">家</span>
    </div>
    <p class="t-sub sub blk" style="padding-top:6px">사진은 AI가 만든 그림</p>
    <h1 class="t-title blk" style="padding-top:20px">오늘 코스를 마쳤어요</h1>
    <p class="t-body blk">오늘 조각을 가족 보자기에 이었어요</p>
  </div>
  <div class="more" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 9l6 6 6-6" fill="none" stroke-width="2.5" stroke-linecap="round"/></svg></div>
  <div class="dock"><a class="btn t-btn tap" data-min="72" href="#">알겠어요</a></div>
  <div class="sian">시안 예시 문구(답 공유 동의한 경우)</div>
</div>
<script src="../common/frame.js"></script>
</body></html>
