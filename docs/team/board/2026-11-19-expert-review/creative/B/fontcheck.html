<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>팻말 글꼴 글자 범위 점검</title>
<link href="https://fonts.googleapis.com/css2?family=Nanum+Brush+Script&family=East+Sea+Dokdo&family=Dokdo&family=Black+Han+Sans&display=block" rel="stylesheet">
</head>
<body>
<!-- 어르신이 칠 수 있는 낱말의 글자가 팻말 글꼴에 있는지 본다. 없으면 대체 글꼴로 섞여 보인다(팻말이 깨짐).
     방법: 같은 글자를 '<글꼴>, monospace' 와 '<글꼴>, serif' 로 재서 폭이 같으면 그 글꼴에 글자가 있다. -->
<pre id="m" hidden></pre>
<script>
const fonts = ['Nanum Brush Script', 'East Sea Dokdo', 'Dokdo', 'Black Han Sans'];
// 앞: 콘텐츠 낱말(30일)에서 쓰는 글자. 뒤: KS X 1001 완성형 2,350자에 없는 글자 10자(어르신이 잘못 치거나 사투리로 칠 수 있음)
const common = '나무라디오부엌감단풍잎송편달연필고무신도시락우산항아리두레박평상바구니버스학교종빗자루칠판숟가락선풍기책가방국자한복가마솥낚싯대꽃다발앞마당닭장흙담';
const rare = '똠햏뷁쌰펲갃됬얬쏼뀪';
const c = document.createElement('canvas').getContext('2d');
function has(font, ch) {
  c.font = `40px "${font}", monospace`; const a = c.measureText(ch).width;
  c.font = `40px "${font}", serif`; const b = c.measureText(ch).width;
  return Math.abs(a - b) < 0.01;
}
Promise.all(fonts.map(f => document.fonts.load(`40px "${f}"`, common + rare))).then(() => {
  const out = {};
  for (const f of fonts) {
    const cs = [...new Set(common)], rs = [...new Set(rare)];
    out[f] = { commonMissing: cs.filter(ch => !has(f, ch)).join(''), commonTotal: cs.length,
               rareHave: rs.filter(ch => has(f, ch)).join(''), rareTotal: rs.length };
  }
  document.getElementById('m').textContent = JSON.stringify(out);
});
</script>
</body>
</html>
